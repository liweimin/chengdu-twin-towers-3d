<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChatGPT 4th Anniversary — Unofficial Kinetic Tribute</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #070910; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
  const W = 1920, H = 1080;
  const BPM = 128;
  const BEAT = 60 / BPM; // 0.46875s
  const BAR = BEAT * 4;  // 1.875s
  const DURATION = 50.0;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Pre-bake subtle organic film grain tile (OpenAI 2025-2026 tactile print/gradient feel)
  const grainCanvas = document.createElement('canvas');
  grainCanvas.width = 256;
  grainCanvas.height = 256;
  const gctx = grainCanvas.getContext('2d');
  const gImg = gctx.createImageData(256, 256);
  let gSeed = 424242;
  for (let i = 0; i < gImg.data.length; i += 4) {
    gSeed = (gSeed * 1664525 + 1013904223) >>> 0;
    const v = (gSeed >>> 24);
    gImg.data[i] = v;
    gImg.data[i + 1] = v;
    gImg.data[i + 2] = v;
    gImg.data[i + 3] = 16;
  }
  gctx.putImageData(gImg, 0, 0);
  const grainPattern = ctx.createPattern(grainCanvas, 'repeat');

  // Deterministic PRNG for stars/particles
  function seeded(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  }

  // Easing functions
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(t));
  const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
  const easeInOutCubic = t => {
    t = clamp(t);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  };
  const easeOutBack = t => {
    t = clamp(t);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const prog = (t, start, dur) => clamp((t - start) / dur, 0, 1);

  // Beat / Groove helpers synced to 128 BPM audio
  function beatPulse(t) {
    if (t < 2 * BAR || t > 23.2 * BAR) return 0;
    const ph = (t / BEAT) % 1;
    return Math.exp(-ph * 7.5);
  }
  function halfBeatPulse(t) {
    if (t < 2 * BAR || t > 23.2 * BAR) return 0;
    const ph = (t / (BEAT * 0.5)) % 1;
    return Math.exp(-ph * 8.0);
  }
  function snarePulse(t) {
    if (t < 2 * BAR || t > 23.0 * BAR) return 0;
    const b = (t / BEAT) % 4;
    if (b >= 1 && b < 2) return Math.exp(-(b - 1) * 9);
    if (b >= 3 && b < 4) return Math.exp(-(b - 3) * 9);
    return 0;
  }

  // Fonts
  const SANS = '"Segoe UI", "Bahnschrift", "Helvetica Neue", Arial, sans-serif';
  const MONO = '"Consolas", "Courier New", monospace';

  // Drawing primitives
  function roundRect(x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function drawPill(x, y, text, opts = {}) {
    const {
      bg = 'rgba(0,0,0,0.06)',
      fg = '#0A0B0E',
      border = null,
      fontSize = 20,
      font = SANS,
      weight = 600,
      padX = 22,
      padY = 11,
      align = 'left',
      dotColor = null,
      alpha = 1
    } = opts;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.font = `${weight} ${fontSize}px ${font}`;
    const tw = ctx.measureText(text).width;
    const dotW = dotColor ? 18 : 0;
    const w = tw + padX * 2 + dotW;
    const h = fontSize + padY * 2;
    const rx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    const ry = y - h / 2;
    roundRect(rx, ry, w, h, h / 2);
    ctx.fillStyle = bg;
    ctx.fill();
    if (border) {
      ctx.strokeStyle = border;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    if (dotColor) {
      ctx.beginPath();
      ctx.arc(rx + padX + 5, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = dotColor;
      ctx.fill();
    }
    ctx.fillStyle = fg;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, rx + padX + dotW, y + 1);
    ctx.restore();
    return { w, h };
  }

  function drawCard(x, y, w, h, r, opts = {}) {
    const {
      bg = '#FFFFFF',
      border = null,
      shadow = 'rgba(10,12,20,0.08)',
      shadowBlur = 40,
      shadowY = 16,
      alpha = 1
    } = opts;
    ctx.save();
    ctx.globalAlpha *= alpha;
    if (shadow) {
      ctx.shadowColor = shadow;
      ctx.shadowBlur = shadowBlur;
      ctx.shadowOffsetY = shadowY;
    }
    roundRect(x, y, w, h, r);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    if (border) {
      ctx.strokeStyle = border;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawClippedText(text, x, y, p, opts = {}) {
    const {
      fontSize = 96,
      weight = 800,
      color = '#0A0B0E',
      align = 'left',
      font = SANS,
      offsetY = 65
    } = opts;
    const e = easeOutExpo(p);
    ctx.save();
    ctx.font = `${weight} ${fontSize}px ${font}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';
    ctx.beginPath();
    ctx.rect(0, y - fontSize * 1.15, W, fontSize * 1.45);
    ctx.clip();
    ctx.fillStyle = color;
    ctx.globalAlpha *= clamp(p * 2.5);
    ctx.fillText(text, x, y + (1 - e) * offsetY);
    ctx.restore();
  }

  function drawMeshGradient(blobs, baseColor = '#FAFAF8', grainAlpha = 0.45) {
    ctx.fillStyle = baseColor;
    ctx.fillRect(0, 0, W, H);
    for (const b of blobs) {
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, b.c0);
      g.addColorStop(0.55, b.c1 || 'rgba(255,255,255,0)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    if (grainAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = grainAlpha;
      ctx.fillStyle = grainPattern;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  function drawEditorialGrid(dark = false, alpha = 0.06) {
    ctx.save();
    ctx.strokeStyle = dark ? `rgba(255,255,255,${alpha})` : `rgba(10,12,18,${alpha})`;
    ctx.lineWidth = 1;
    const cols = 12;
    const margin = 96;
    const cw = (W - margin * 2) / cols;
    for (let i = 0; i <= cols; i++) {
      const x = Math.round(margin + i * cw) + 0.5;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 120; y < H; y += 120) {
      ctx.beginPath();
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStarfield(t, count = 180, speed = 28) {
    ctx.save();
    for (let i = 0; i < count; i++) {
      const sx = (seeded(i * 3.1) * W + t * speed * (0.2 + seeded(i * 7.7))) % W;
      const sy = seeded(i * 5.3) * H;
      const r = 0.8 + seeded(i * 11.1) * 2.1;
      const tw = 0.35 + 0.65 * Math.sin(t * (2 + seeded(i * 2.3) * 4) + i);
      ctx.fillStyle = `rgba(255,248,235,${tw * 0.75})`;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Stylized abstract geometric tribute rosette (inspired by, not a trademark copy of official logo)
  function drawTributeEmblem(cx, cy, radius, rot, color = '#0A0B0E', lineWidth = 2.5) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    for (let i = 0; i < 6; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI) / 3);
      ctx.beginPath();
      ctx.ellipse(radius * 0.34, 0, radius * 0.44, radius * 0.24, Math.PI / 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // =========================================================================
  // SCENE 1 (0.00s - 3.75s): THE PROMPT THAT CHANGED EVERYTHING
  // =========================================================================
  function renderScene1(t) {
    const p = t / (2 * BAR);
    const launch = prog(t, 3.25, 0.5);
    const zoom = 1 + easeInOutCubic(launch) * 0.16;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(-W / 2, -H / 2);

    // Warm crisp alabaster canvas with soft OpenAI-inspired pastel washes
    drawMeshGradient([
      { x: 320 + Math.sin(t) * 60, y: 240, r: 720, c0: 'rgba(255,196,163,0.28)' },
      { x: 1620, y: 860 - Math.cos(t) * 50, r: 760, c0: 'rgba(134,239,172,0.22)' },
      { x: 960, y: 540, r: 620, c0: 'rgba(56,189,248,0.12)' }
    ], '#FAFAF8', 0.45);
    drawEditorialGrid(false, 0.045);

    // Floating faint kinetic background rings
    ctx.save();
    ctx.strokeStyle = 'rgba(10,12,18,0.05)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(W / 2, H / 2 + 20, 260 + i * 130 + Math.sin(t * 2 + i) * 12, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    // Top Unofficial Tribute Badge
    const badgeP = easeOutExpo(prog(t, 0.1, 0.55));
    drawPill(W / 2, 235 + (1 - badgeP) * 24, 'AN UNOFFICIAL 4TH ANNIVERSARY TRIBUTE  ·  2022–2026', {
      align: 'center',
      bg: '#0A0B0E',
      fg: '#FFFFFF',
      font: MONO,
      fontSize: 18,
      padX: 26,
      padY: 12,
      dotColor: '#38BDF8',
      alpha: badgeP
    });

    // Editorial Hero Question (direct nod to openai.com homepage hero!)
    drawClippedText('Four years ago, one prompt', W / 2, 375, prog(t, 0.25, 0.65), {
      fontSize: 78, weight: 700, color: '#0A0B0E', align: 'center', offsetY: 50
    });
    drawClippedText('changed everything.', W / 2, 462, prog(t, 0.45, 0.65), {
      fontSize: 78, weight: 700, color: '#0A0B0E', align: 'center', offsetY: 50
    });

    // Central ChatGPT Prompt Box
    const boxP = easeOutBack(prog(t, 0.35, 0.7));
    const bx = W / 2 - 480, by = 535 + (1 - boxP) * 40, bw = 960, bh = 124;
    drawCard(bx, by, bw, bh, 34, {
      bg: '#FFFFFF',
      border: 'rgba(10,12,18,0.08)',
      shadow: 'rgba(14,165,233,0.16)',
      shadowBlur: 55,
      shadowY: 22,
      alpha: clamp(boxP)
    });

    // Typed text synced to keystroke clicks!
    const fullStr = 'Nov 30, 2022 — Launch ChatGPT. Show us the next 4 years.';
    const typedCount = Math.floor(clamp((t - 0.25) / 2.95) * fullStr.length);
    const typed = fullStr.slice(0, typedCount);

    ctx.save();
    ctx.font = `500 30px ${SANS}`;
    ctx.fillStyle = '#0A0B0E';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(typed, bx + 42, by + bh / 2);

    // Blinking cursor
    const tw = ctx.measureText(typed).width;
    if (Math.floor(t * 7) % 2 === 0 || typedCount < fullStr.length) {
      ctx.fillStyle = '#0EA5E9';
      ctx.fillRect(bx + 44 + tw + 4, by + bh / 2 - 20, 3.5, 40);
    }

    // Circular Submit Button (presses down right before drop at 3.5s)
    const pressed = t > 3.35 ? 0.86 : 1.0;
    const btnX = bx + bw - 54, btnY = by + bh / 2;
    ctx.save();
    ctx.translate(btnX, btnY);
    ctx.scale(pressed, pressed);
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fillStyle = t > 3.2 ? '#0EA5E9' : '#0A0B0E';
    ctx.fill();
    // Up arrow
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 11); ctx.lineTo(0, -11);
    ctx.moveTo(-9, -2); ctx.lineTo(0, -11); ctx.lineTo(9, -2);
    ctx.stroke();
    ctx.restore();
    ctx.restore();

    // Quick-action chips below prompt box (matching openai.com hero chips!)
    const chips = ['GPT-3.5', 'GPT-4', 'GPT-4o', 'o1 · o3', 'GPT-5', 'GPT-6'];
    const chipStartX = W / 2 - 395;
    chips.forEach((label, idx) => {
      const cp = easeOutExpo(prog(t, 0.9 + idx * 0.14, 0.45));
      drawPill(chipStartX + idx * 158, 725 + (1 - cp) * 20, label, {
        align: 'center',
        bg: 'rgba(10,12,18,0.05)',
        border: 'rgba(10,12,18,0.08)',
        fg: '#2B2E36',
        fontSize: 19,
        padX: 22,
        padY: 10,
        alpha: cp
      });
    });

    // Radial shockwave burst right at drop (3.40s -> 3.75s)
    if (t > 3.38) {
      const sp = easeOutExpo(prog(t, 3.38, 0.37));
      ctx.save();
      ctx.beginPath();
      ctx.arc(btnX, btnY, sp * 2400, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(10,11,16,${sp * 0.92})`;
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // =========================================================================
  // SCENE 2 (3.75s - 7.50s): 2022.11.30 — THE SPARK & FASTEST APP IN HISTORY
  // =========================================================================
  function renderScene2(t) {
    const lt = t - 2 * BAR; // 0 to 3.75s
    const bp = beatPulse(t);
    const phase2 = lt >= BAR; // 1.875s split

    // Rich Coral-Tangerine-Sage OpenAI Mesh Gradient
    drawMeshGradient([
      { x: 400 + Math.sin(t * 1.5) * 140, y: 300, r: 950, c0: 'rgba(255,112,135,0.42)', c1: 'rgba(251,146,60,0.18)' },
      { x: 1550, y: 780 + Math.cos(t * 1.8) * 100, r: 900, c0: 'rgba(134,239,172,0.38)', c1: 'rgba(56,189,248,0.12)' },
      { x: 960, y: 540, r: 700, c0: `rgba(255,255,255,${0.35 + bp * 0.15})` }
    ], '#FAF8F5', 0.55);
    drawEditorialGrid(false, 0.05);

    if (!phase2) {
      // Sub-scene 2A (3.75s - 5.625s): Nov 30, 2022 · 1M Users in 5 Days
      const p1 = easeOutExpo(prog(lt, 0, 0.45));
      const p2 = easeOutExpo(prog(lt, BEAT * 2, 0.45));

      // Left Editorial Card: Date & Launch
      drawCard(96, 175, 820, 720, 32, {
        bg: '#0A0B0E',
        shadow: 'rgba(10,12,20,0.22)',
        shadowBlur: 60,
        alpha: p1
      });
      drawPill(148, 245, 'CHAPTER 01  ·  THE SPARK', {
        bg: 'rgba(255,255,255,0.12)', fg: '#FFFFFF', font: MONO, fontSize: 18, dotColor: '#FB923C'
      });
      drawClippedText('2022', 148, 465, prog(lt, 0.05, 0.5), {
        fontSize: 196, weight: 800, color: '#FFFFFF'
      });
      drawClippedText('NOV 30', 154, 565, prog(lt, 0.16, 0.5), {
        fontSize: 78, weight: 700, color: '#FDBA74'
      });

      ctx.save();
      ctx.font = `500 30px ${SANS}`;
      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.fillText('ChatGPT launches as a free', 154, 660);
      ctx.fillText('GPT-3.5 research preview.', 154, 704);
      ctx.restore();

      drawPill(154, 800, 'GPT-3.5 ARCHITECTURE', {
        bg: 'rgba(251,146,60,0.18)', border: 'rgba(251,146,60,0.45)', fg: '#FED7AA', font: MONO, fontSize: 18
      });

      // Right Giant Stat Card: 1,000,000 Users in 5 Days
      const cardReveal = prog(lt, BEAT * 0.75, 0.42);
      const scalePop = 0.92 + 0.08 * easeOutBack(cardReveal) + bp * 0.025;
      ctx.save();
      ctx.globalAlpha = clamp(cardReveal * 1.8);
      ctx.translate(1390, 535);
      ctx.scale(scalePop, scalePop);
      ctx.translate(-1390, -535);
      drawCard(956, 175, 868, 720, 32, {
        bg: 'rgba(255,255,255,0.92)',
        border: 'rgba(10,12,18,0.06)',
        alpha: 1
      });

      const countVal = Math.floor(lerp(120000, 1000000, easeOutExpo(prog(lt, BEAT * 0.8, 0.75))));
      ctx.font = `800 132px ${SANS}`;
      ctx.fillStyle = '#0A0B0E';
      ctx.textAlign = 'center';
      ctx.fillText(countVal.toLocaleString('en-US'), 1390, 480);

      ctx.font = `700 44px ${SANS}`;
      ctx.fillStyle = '#EA580C';
      ctx.fillText('USERS IN JUST 5 DAYS', 1390, 560);

      // 5-day progress blocks
      for (let d = 0; d < 5; d++) {
        const dp = easeOutExpo(prog(lt, BEAT * 0.9 + d * 0.08, 0.25));
        const bx = 1090 + d * 124;
        ctx.save();
        ctx.globalAlpha *= dp;
        drawCard(bx, 635, 104, 140, 18, {
          bg: d === 4 ? '#EA580C' : '#F3F4F6',
          shadow: null,
          alpha: 1
        });
        ctx.fillStyle = d === 4 ? '#FFFFFF' : '#0A0B0E';
        ctx.font = `700 22px ${MONO}`;
        ctx.textAlign = 'center';
        ctx.fillText(`DAY ${d + 1}`, bx + 52, 695);
        ctx.font = `600 18px ${SANS}`;
        ctx.fillStyle = d === 4 ? '#FFEDD5' : '#6B7280';
        ctx.fillText(d === 4 ? '1M!' : `${(d + 1) * 200}K`, bx + 52, 735);
        ctx.restore();
      }
      ctx.restore();
    } else {
      // Sub-scene 2B (5.625s - 7.50s): 100M MONTHLY USERS IN 2 MONTHS + Adoption Curve
      const st = lt - BAR;
      const p1 = easeOutExpo(prog(st, 0, 0.45));

      // Top Big Metric
      drawPill(96, 178, 'JANUARY 2023  ·  HISTORIC RECORD', {
        bg: '#0A0B0E', fg: '#FFFFFF', font: MONO, fontSize: 19, dotColor: '#34D399'
      });

      const mVal = Math.floor(lerp(1, 100, easeOutExpo(prog(st, 0.05, 0.65))));
      ctx.save();
      ctx.translate(96, 395);
      const pop = 1 + bp * 0.03;
      ctx.scale(pop, pop);
      ctx.font = `800 210px ${SANS}`;
      ctx.fillStyle = '#0A0B0E';
      ctx.textAlign = 'left';
      ctx.fillText(`${mVal}M`, 0, 0);
      ctx.restore();

      drawClippedText('MONTHLY ACTIVE USERS', 680, 315, prog(st, 0.1, 0.45), {
        fontSize: 64, weight: 800, color: '#0A0B0E'
      });
      drawClippedText('IN JUST 2 MONTHS.', 680, 395, prog(st, 0.2, 0.45), {
        fontSize: 64, weight: 800, color: '#059669'
      });

      // Full-width Kinetic Comparison Bar Chart Card
      drawCard(96, 465, 1728, 445, 32, {
        bg: 'rgba(255,255,255,0.92)',
        border: 'rgba(10,12,18,0.07)',
        alpha: p1
      });

      ctx.font = `700 24px ${MONO}`;
      ctx.fillStyle = '#6B7280';
      ctx.textAlign = 'left';
      ctx.fillText('TIME TO REACH 100 MILLION MONTHLY USERS  (FASTEST CONSUMER APP IN HISTORY)', 150, 528);

      const bars = [
        { name: 'ChatGPT (2023)', label: '2 MONTHS', val: 1.0, color: '#059669', highlight: true },
        { name: 'TikTok', label: '9 MONTHS', val: 0.42, color: '#9CA3AF', highlight: false },
        { name: 'Instagram', label: '30 MONTHS', val: 0.22, color: '#D1D5DB', highlight: false },
      ];
      bars.forEach((b, idx) => {
        const bp2 = easeOutExpo(prog(st, 0.18 + idx * 0.14, 0.55));
        const y = 580 + idx * 102;
        ctx.font = `700 28px ${SANS}`;
        ctx.fillStyle = b.highlight ? '#0A0B0E' : '#4B5563';
        ctx.textAlign = 'left';
        ctx.fillText(b.name, 150, y + 36);

        const maxW = 1120;
        const bw = maxW * b.val * bp2;
        roundRect(470, y, Math.max(24, bw), 56, 28);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.font = `800 24px ${MONO}`;
        ctx.fillStyle = b.highlight ? '#059669' : '#6B7280';
        ctx.fillText(b.label, 470 + bw + 24, y + 36);
      });
    }
  }

  // =========================================================================
  // SCENE 3 (7.50s - 11.25s): 2023 — GPT-4 & FIRST DEVDAY (100M WAU)
  // =========================================================================
  function renderScene3(t) {
    const lt = t - 4 * BAR; // 0 to 3.75s
    const bp = beatPulse(t);
    const phase2 = lt >= BAR; // 1.875s

    drawMeshGradient([
      { x: 1580, y: 240, r: 900, c0: 'rgba(167,139,250,0.28)' },
      { x: 260, y: 840, r: 850, c0: 'rgba(56,189,248,0.25)' }
    ], '#F8FAFC', 0.48);
    drawEditorialGrid(false, 0.05);

    if (!phase2) {
      // 3A: MAR 14, 2023 — GPT-4
      drawPill(96, 175, 'MARCH 14, 2023  ·  GENERATIONAL LEAP', {
        bg: '#0A0B0E', fg: '#FFFFFF', font: MONO, fontSize: 19, dotColor: '#818CF8'
      });

      const zoom = 1 + bp * 0.025;
      ctx.save();
      ctx.translate(96, 400);
      ctx.scale(zoom, zoom);

  // =========================================================================
  // PERSISTENT EDITORIAL TELEMETRY HUD (Third-party retrospective framing)
  // =========================================================================
  function renderHUD(t) {
    // Determine if current frame is dark-mode for HUD contrast
    const isDark =
      (t >= 5 * BAR && t < 6 * BAR) ||
      (t >= 6 * BAR && t < 12 * BAR) ||
      (t >= 15 * BAR && t < 23 * BAR);

    // Hide HUD during final fade or montage flash
    if (t > 43.125 && t < 44.05) return;
    let hudAlpha = 1;
    if (t > 48.2) hudAlpha = 1 - prog(t, 48.2, 1.4);

    const fg = isDark ? 'rgba(255,255,255,0.82)' : 'rgba(10,11,16,0.78)';
    const muted = isDark ? 'rgba(255,255,255,0.38)' : 'rgba(10,11,16,0.35)';
    const lineCol = isDark ? 'rgba(255,255,255,0.14)' : 'rgba(10,11,16,0.12)';
    const bp = beatPulse(t);

    ctx.save();
    ctx.globalAlpha = hudAlpha;

    // Top-left: Tribute Label
    ctx.font = `700 17px ${MONO}`;
    ctx.fillStyle = fg;
    ctx.textAlign = 'left';
    ctx.fillText('CHATGPT // 4Y UNOFFICIAL TRIBUTE', 96, 68);

    // Top-right: Live Era Indicator + Beat Pulse Dot
    let era = '2022.11.30';
    if (t >= 23 * BAR) era = '2022 — 2026';
    else if (t >= 18 * BAR) era = '2026 · GPT-6 ERA';
    else if (t >= 15 * BAR) era = '2023–2026 · SCALE';
    else if (t >= 12 * BAR) era = '2025 · GPT-5 ERA';
    else if (t >= 9 * BAR) era = '2024–25 · REASONING';
    else if (t >= 6 * BAR) era = '2024 · OMNI ERA';
    else if (t >= 4 * BAR) era = '2023 · GPT-4 ERA';
    else if (t >= 2 * BAR) era = '2022–23 · THE SPARK';

    ctx.textAlign = 'right';
    ctx.fillStyle = fg;
    ctx.fillText(era, 1824, 68);

    // Bottom Timeline Scrubber Bar + Audio-Reactive Beat Equalizer
    const barY = 1018;
    const barX = 96, barW = 1480;
    ctx.fillStyle = lineCol;
    roundRect(barX, barY, barW, 4, 2);
    ctx.fill();

    const progress = clamp(t / DURATION);
    ctx.fillStyle = isDark ? '#38BDF8' : '#0A0B0E';
    roundRect(barX, barY, barW * progress, 4, 2);
    ctx.fill();

    // Glowing scrubber head
    ctx.beginPath();
    ctx.arc(barX + barW * progress, barY + 2, 6 + bp * 3, 0, Math.PI * 2);
    ctx.fillStyle = isDark ? '#FFB85C' : '#0EA5E9';
    ctx.fill();

    // Year ticks along bottom
    ['2022', '2023', '2024', '2025', '2026'].forEach((yr, i) => {
      ctx.font = `600 14px ${MONO}`;
      ctx.fillStyle = muted;
      ctx.textAlign = i === 0 ? 'left' : i === 4 ? 'right' : 'center';
      ctx.fillText(yr, barX + (barW * i) / 4, barY - 12);
    });

    // Bottom-right: 16-bar Beat-Synced Visualizer
    const vizX = 1620;
    for (let i = 0; i < 16; i++) {
      const freqWave = Math.abs(Math.sin(t * (7 + i * 0.9) + i * 1.3));
      const active = t >= 2 * BAR && t < 24 * BAR ? 1 : 0.25;
      const h = 4 + (bp * 20 + freqWave * 16) * active;
      ctx.fillStyle = isDark ? 'rgba(255,184,92,0.85)' : 'rgba(10,11,16,0.75)';
      roundRect(vizX + i * 13, barY + 4 - h, 7, h, 3);
      ctx.fill();
    }

    ctx.restore();
  }

  // =========================================================================
  // MASTER FRAME RENDERER (Called deterministically by Puppeteer for every frame)
  // =========================================================================
  window.renderFrame = function(frameIndex, fps = 30) {
    const t = frameIndex / fps;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    if (t < 2 * BAR) {
      renderScene1(t);
    } else if (t < 4 * BAR) {
      renderScene2(t);
    } else if (t < 6 * BAR) {
      renderScene3(t);
    } else if (t < 9 * BAR) {
      renderScene4(t);
    } else if (t < 12 * BAR) {
      renderScene5(t);
    } else if (t < 15 * BAR) {
      renderScene6(t);
    } else if (t < 18 * BAR) {
      renderScene7(t);
    } else if (t < 23 * BAR) {
      renderScene8(t);
    } else {
      renderScene9(t);
    }

    // Crisp Beat-Hit White Flash on major act transitions (first 0.14s of act drop)
    const drops = [2 * BAR, 6 * BAR, 9 * BAR, 12 * BAR, 15 * BAR, 18 * BAR, 23 * BAR];
    for (const d of drops) {
      if (t >= d && t < d + 0.16) {
        const fa = (1 - (t - d) / 0.16);
        ctx.fillStyle = `rgba(255,255,255,${fa * fa * 0.55})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    renderHUD(t);
  };

  // Render preview frame 0 on load
  window.renderFrame(0, 30);
})();
</script>
</body>
</html>
