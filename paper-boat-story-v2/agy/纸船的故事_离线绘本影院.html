<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>纸船的故事 · 水彩绘本动画短片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, #FAF5E8 0%, #EFE6D3 100%);
      color: #4F3D31;
      font-family: "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }
    .book-frame {
      width: min(94vw, 1180px);
      background: #FCF9F1;
      border-radius: 14px;
      padding: 14px 14px 16px;
      box-shadow: 0 22px 60px rgba(74, 56, 40, 0.16), 0 4px 16px rgba(74, 56, 40, 0.08);
      border: 1px solid rgba(168, 144, 112, 0.28);
    }
    .stage-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: #FCF9F1;
      cursor: pointer;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .cover-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(252, 249, 241, 0.32);
      backdrop-filter: blur(2px);
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }
    .cover-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .play-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 30px;
      border-radius: 999px;
      border: 1.5px solid rgba(110, 82, 62, 0.35);
      background: rgba(255, 253, 247, 0.92);
      color: #543D2E;
      font-size: 20px;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(84, 61, 46, 0.16);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .play-pill:hover {
      transform: translateY(-2px) scale(1.02);
      background: #FFFFFF;
    }
    .play-icon {
      width: 0; height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 15px solid #5C8DC4;
      margin-left: 3px;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px 6px;
    }
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      border: 1px solid rgba(130, 105, 84, 0.28);
      background: #FFFDF8;
      color: #543D2E;
      border-radius: 8px;
      padding: 6px 13px;
      font-size: 14px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #F5ECD9; }
    .scrubber {
      flex: 1;
      height: 6px;
      accent-color: #588DC9;
      cursor: pointer;
    }
    .timecode {
      font-size: 13px;
      font-family: ui-monospace, Consolas, monospace;
      color: #7D6857;
      min-width: 92px;
      text-align: right;
    }
    .chapters {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chapter-btn {
      flex: 1;
      min-width: 130px;
      text-align: center;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: rgba(235, 224, 202, 0.42);
      color: #6B5748;
      font-size: 13px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chapter-btn:hover { background: rgba(220, 206, 178, 0.65); }
    .chapter-btn.active {
      background: rgba(88, 141, 201, 0.16);
      border-color: rgba(88, 141, 201, 0.45);
      color: #385E8C;
      font-weight: 600;
    }
    .subtitle {
      margin-top: 10px;
      font-size: 13px;
      color: #8C7766;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.5px;
    }
  </style>

    // Subtle dried watercolor edge-pooling rim
    if (rimStroke > 0) {
      const rimPoly = variance > 0.005 ? deformPts(pts, this.rng, iters, variance * 0.65, true) : pts;
      traceSmooth(ctx, rimPoly, true);
      ctx.strokeStyle = rgba(color2 || color, alpha * rimStroke);
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Opaque-ish paper-reserve / gouache base (keeps foreground subjects luminous over background)
  reserve(pts, color = '#FCF9F1', alpha = 0.95, blur = 0) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    traceSmooth(ctx, pts, true);
    ctx.fillStyle = rgba(color, alpha);
    ctx.fill();
    ctx.restore();
  }

  // Smooth atmospheric radial wash (sky glow, sunlight bloom, soft shadows)
  glow(cx, cy, rx, ry, color, alpha = 0.40, composite = 'multiply', rot = 0) {
    const [r, g, b] = hexToRgb(color);
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = composite;
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(1, ry / Math.max(1, rx));
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(0.55, `rgba(${r},${g},${b},${alpha * 0.48})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Organic tapered watercolor brush stroke (leaves, grass blades, branches, hair locks)
  stroke(points, opts = {}) {
    const {
      color = '#5CA456',
      width = 8,
      alpha = 0.65,
      taperStart = 0.3,
      taperEnd = 0.04,
      composite = 'multiply',
      blur = 0.5,
      rimStroke = 0.18,
    } = opts;
    if (points.length < 2) return;
    const left = [], right = [];
    for (let i = 0; i < points.length; i++) {
      const t = i / (points.length - 1);
      const p = points[i];
      const prev = points[Math.max(0, i - 1)];
      const next = points[Math.min(points.length - 1, i + 1)];
      const dx = next[0] - prev[0], dy = next[1] - prev[1];
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const bell = Math.sin(t * Math.PI);
      const w = width * 0.5 * ((taperStart * (1 - t) + taperEnd * t) * 0.35 + bell * 0.88);
      left.push([p[0] + nx * w, p[1] + ny * w]);
      right.unshift([p[0] - nx * w, p[1] - ny * w]);
    }
    this.wash([...left, ...right], {
      color,
      alpha,
      layers: 3,
      variance: 0.05,
      iters: 1,
      blur,
      composite,
      rimStroke,
    });
  }

  // Expressive hand-drawn sepia/indigo colored-pencil line (variable pressure & gentle sketch feel)
  pencil(points, opts = {}) {
    const {
      color = '#6D5242',
      width = 1.4,
      alpha = 0.52,
      jitter = 0.45,
      passes = 2,
    } = opts;
    const [r, g, b] = hexToRgb(color);
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let pass = 0; pass < passes; pass++) {
      const sub = [];
      for (let i = 0; i < points.length - 1; i++) {
        const a = points[i], c = points[i + 1];
        const steps = Math.max(2, Math.ceil(Math.hypot(c[0] - a[0], c[1] - a[1]) / 5));
        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          sub.push([
            a[0] + (c[0] - a[0]) * t + this.rng.gauss(0, jitter * (pass ? 0.9 : 0.45)),
            a[1] + (c[1] - a[1]) * t + this.rng.gauss(0, jitter * (pass ? 0.9 : 0.45)),
          ]);
        }
      }
      sub.push(points[points.length - 1]);
      for (let i = 0; i < sub.length - 1; i++) {
        const t = i / Math.max(1, sub.length - 1);
        const fade = Math.sin(Math.min(1, t * 6) * Math.PI * 0.5) * Math.sin(Math.min(1, (1 - t) * 6) * Math.PI * 0.5);
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * (pass ? 0.32 : 0.68) * fade})`;
        ctx.lineWidth = Math.max(0.5, width * (pass ? 0.72 : 1.0) * (0.8 + 0.35 * Math.sin(t * Math.PI)));
        ctx.beginPath();
        ctx.moveTo(sub[i][0], sub[i][1]);
        ctx.lineTo(sub[i + 1][0], sub[i + 1][1]);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ============================================================================
  // PAINTERLY ENVIRONMENT BUILDERS (Ghibli / Classic Picture-Book Watercolor!)
  // ============================================================================

  // 1. Luminous Sky with Soft Hand-Painted Watercolor Clouds
  paintSky(horizonY, opts = {}) {
    const {
      topColor = '#8CCAE6',
      midColor = '#CBEAF5',
      horizonColor = '#FFF3CC',
      sunX = 1280,
      sunY = 140,
      sunColor = '#FFE28A',
      cloudCount = 4,
    } = opts;

    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const grad = ctx.createLinearGradient(0, 0, 0, horizonY + 40);
    grad.addColorStop(0, rgba(topColor, 0.72));
    grad.addColorStop(0.52, rgba(midColor, 0.52));
    grad.addColorStop(1, rgba(horizonColor, 0.48));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.w, horizonY + 40);
    ctx.restore();

    // Warm sun atmospheric halo
    this.glow(sunX, sunY, 440, 260, sunColor, 0.50, 'multiply');
    this.glow(sunX, sunY, 260, 160, '#FFFDF5', 0.78, 'screen');

    // Soft seamless Miyazaki-style watercolor cumulus clouds (merged offscreen so zero circle overlaps!)
    const cloudCanv = document.createElement('canvas');
    cloudCanv.width = this.w;
    cloudCanv.height = horizonY + 20;
    const cctx = cloudCanv.getContext('2d');

    for (let i = 0; i < cloudCount; i++) {
      const cx = this.rng.range(180, this.w - 180);
      const cy = this.rng.range(62, horizonY * 0.50);
      const cw = this.rng.range(150, 270);
      const ch = this.rng.range(38, 66);

      cctx.clearRect(0, 0, cloudCanv.width, cloudCanv.height);
      const puffs = 7;
      const puffList = [];
      for (let p = 0; p < puffs; p++) {
        const u = p / (puffs - 1);
        const px = cx + (u - 0.5) * cw * 1.1 + this.rng.range(-12, 12);
        const py = cy - Math.sin(u * Math.PI) * ch * 0.62 + this.rng.range(-6, 6);
        const prx = cw * this.rng.range(0.18, 0.30) * (0.7 + 0.5 * Math.sin(u * Math.PI));
        const pry = ch * this.rng.range(0.48, 0.85) * (0.7 + 0.45 * Math.sin(u * Math.PI));
        puffList.push([px, py, prx, pry]);
      }

      // Draw unified opaque cream-white cloud silhouette on offscreen canvas
      cctx.fillStyle = '#FFFDF7';
      for (const [px, py, prx, pry] of puffList) {
        traceSmooth(cctx, deformPts(ellipsePts(px, py, prx, pry, 14), this.rng, 1, 0.07), true);
        cctx.fill();
      }
      // Paint soft cool lavender-blue underside shading clipped inside the unified cloud!
      cctx.save();
      cctx.globalCompositeOperation = 'source-atop';
      const uGrad = cctx.createLinearGradient(0, cy - ch, 0, cy + ch * 0.55);
      uGrad.addColorStop(0, 'rgba(255,253,245,0)');
      uGrad.addColorStop(0.62, 'rgba(180,202,228,0.10)');
      uGrad.addColorStop(1, 'rgba(155,182,216,0.34)');
      cctx.fillStyle = uGrad;
      cctx.fillRect(0, 0, cloudCanv.width, cloudCanv.height);
      cctx.restore();

      // Composite unified fluffy cloud onto sky
      ctx.save();
      ctx.globalAlpha = 0.82;
      ctx.drawImage(cloudCanv, 0, 0);
      ctx.restore();
    }
  }

  // 2. Layered Atmospheric Distant Hills / Wooded Horizon (Instant 3D Depth!)
  paintDistantHills(horizonY, layers = []) {
    for (const layer of layers) {
      const { color, color2, alpha = 0.55, amp = 55, yOff = 0, freq = 0.0028, phase = 0, blur = 2.5 } = layer;
      const pts = [[-40, horizonY + 30]];
      const steps = 28;
      for (let i = 0; i <= steps; i++) {
        const x = -40 + (i / steps) * (this.w + 80);
        const y = horizonY + yOff
          - Math.abs(Math.sin(x * freq + phase)) * amp
          - Math.sin(x * freq * 2.3 + phase * 1.7) * amp * 0.28
          - this.noise1.sample(x * 0.008 + phase, 1.5) * amp * 0.35;
        pts.push([x, y]);
      }
      pts.push([this.w + 40, horizonY + 30]);
      this.wash(pts, {
        color,
        color2: color2 || color,
        alpha,
        layers: 5,
        variance: 0.04,
        blur,
        rimStroke: 0.14,
      });
    }
  }

  // 3. Organic, Varied Painterly Watercolor Tree (Asymmetric trunks + bushy shoreline base + 3-value canopy!)
  paintTree(baseX, baseY, scale = 1.0, opts = {}) {
    const {
      sunFromRight = true,
      alpha = 0.82,
      shadowCol = '#34755E',
      midCol = '#5EA656',
      lightCol = '#B4D65E',
      sunCol = '#ECE678',
      lean = null,
    } = opts;

    const s = scale;
    const treeLean = lean !== null ? lean : this.rng.range(-28, 28);
    const trunkH = this.rng.range(125, 168) * s;
    const trunkTopX = baseX + treeLean * s;
    const trunkTopY = baseY - trunkH;

    // Asymmetric graceful trunk
    this.stroke([
      [baseX, baseY + 6 * s],
      [baseX + treeLean * 0.42 * s, baseY - trunkH * 0.48],
      [trunkTopX, trunkTopY],
    ], { color: '#7A5D48', width: 20 * s, alpha: alpha * 0.82, taperStart: 0.92, taperEnd: 0.32 });

    // Organic varied branches
    const branches = [
      [[trunkTopX - 4 * s, trunkTopY + 34 * s], [trunkTopX - 52 * s, trunkTopY - 12 * s], [trunkTopX - 96 * s, trunkTopY - 38 * s]],
      [[trunkTopX + 4 * s, trunkTopY + 22 * s], [trunkTopX + 48 * s, trunkTopY - 26 * s], [trunkTopX + 98 * s, trunkTopY - 42 * s]],
      [[trunkTopX, trunkTopY + 12 * s], [trunkTopX + treeLean * 0.3 * s, trunkTopY - 48 * s], [trunkTopX - 14 * s, trunkTopY - 92 * s]],
    ];
    for (const br of branches) {
      this.stroke(br, { color: '#8A6A52', width: 9 * s, alpha: alpha * 0.72, taperStart: 0.78, taperEnd: 0.14 });
    }

    // Lush varied asymmetric canopy clusters
    const sunDir = sunFromRight ? 1 : -1;
    const clusters = [
      { dx: -82 + treeLean * 0.5, dy: -trunkH / s - 22, rx: 86, ry: 58 },
      { dx: 4 + treeLean * 0.8, dy: -trunkH / s - 68, rx: 104, ry: 66 },
      { dx: 88 + treeLean * 0.6, dy: -trunkH / s - 26, rx: 88, ry: 56 },
      { dx: -32 + treeLean * 0.5, dy: -trunkH / s + 2, rx: 74, ry: 46 },
      { dx: 48 + treeLean * 0.6, dy: -trunkH / s + 4, rx: 76, ry: 48 },
    ];

    // Pass A: Soft unifying canopy wash
    for (const c of clusters) {
      this.wash(ellipsePts(baseX + c.dx * s, baseY + c.dy * s, c.rx * s, c.ry * s, 14), {
        color: midCol, color2: lightCol, alpha: alpha * 0.38, layers: 4, variance: 0.18, rimStroke: 0.12,
      });
    }
    // Pass B: Deep viridian-teal shadow undersides
    for (const c of clusters) {
      const sx = baseX + (c.dx - sunDir * 18) * s;
      const sy = baseY + (c.dy + 16) * s;
      for (let i = 0; i < 6; i++) {
        const lx = sx + this.rng.gauss(0, c.rx * 0.36 * s);
        const ly = sy + this.rng.gauss(0, c.ry * 0.32 * s);
        this.wash(ellipsePts(lx, ly, this.rng.range(18, 34) * s, this.rng.range(12, 22) * s, 10, this.rng.range(0, 3)), {
          color: shadowCol, alpha: alpha * 0.42, layers: 3, variance: 0.15, rimStroke: 0.16,
        });
      }
    }
    // Pass C: Sunlit golden-chartreuse crown leaves
    for (const c of clusters) {
      const lx0 = baseX + (c.dx + sunDir * 20) * s;
      const ly0 = baseY + (c.dy - 14) * s;
      for (let i = 0; i < 8; i++) {
        const lx = lx0 + this.rng.gauss(0, c.rx * 0.42 * s);
        const ly = ly0 + this.rng.gauss(0, c.ry * 0.36 * s);
        this.wash(ellipsePts(lx, ly, this.rng.range(14, 28) * s, this.rng.range(9, 18) * s, 10, this.rng.range(0, 3)), {
          color: i < 3 ? sunCol : lightCol, alpha: alpha * 0.50, layers: 3, variance: 0.15, rimStroke: 0.18,
        });
      }
    }

    // Lush bushes nestled organically around the base of the trunk (breaks straight shoreline!)
    for (let b = -1; b <= 1; b++) {
      const bx = baseX + b * 46 * s + this.rng.range(-12, 12) * s;
      const by = baseY - this.rng.range(4, 16) * s;
      this.wash(ellipsePts(bx, by, this.rng.range(28, 48) * s, this.rng.range(16, 28) * s, 12), {
        color: b === sunDir ? lightCol : midCol,
        color2: shadowCol,
        alpha: alpha * 0.58,
        layers: 4,
        variance: 0.16,
        rimStroke: 0.15,
      });
    }
  }

  // 4. SILKY SCANLINE-FREE MIRROR-REFLECTION WATER ENGINE!
  //    Composites reflection cleanly onto an offscreen canvas with ZERO row-overlap stripes!
  paintWaterWithReflection(horizonY, opts = {}) {
    const {
      tintTop = '#9EE0E2',
      tintDeep = '#4D9FC2',
      shadeTint = '#5B88B8',
      sunX = 1280,
      sunWidth = 340,
      sunColor = '#FFD970',
      reflectionAlpha = 0.44,
      rippleAmp = 13,
    } = opts;

    const w = this.w, h = this.h;
    const waterH = h - horizonY;

    // Snapshot upper landscape
    const snap = document.createElement('canvas');
    snap.width = w;
    snap.height = horizonY;
    snap.getContext('2d').drawImage(this.canvas, 0, 0, w, horizonY, 0, 0, w, horizonY);

    // Build seamless, scanline-free rippled reflection on a dedicated offscreen canvas
    const refl = document.createElement('canvas');
    refl.width = w;
    refl.height = waterH;
    const rctx = refl.getContext('2d');
    const sliceH = 2;
    for (let y = 0; y < waterH; y += sliceH) {
      const t = y / waterH;
      const srcY = Math.max(0, Math.min(horizonY - sliceH, horizonY - 2 - Math.floor(y * 0.72)));
      const wave = Math.sin(y * 0.065 + t * 6.5) * (rippleAmp * (0.22 + t * 0.92))
                 + Math.sin(y * 0.17) * (rippleAmp * 0.24);
      // Exact sliceH with source-over => ZERO double-multiply horizontal scanlines!
      rctx.drawImage(snap, 0, srcY, w, sliceH, wave, y, w, sliceH);
    }
    // Fade reflection gently with water depth using destination-in gradient
    rctx.save();
    rctx.globalCompositeOperation = 'destination-in';
    const fadeG = rctx.createLinearGradient(0, 0, 0, waterH);
    fadeG.addColorStop(0, `rgba(255,255,255,${reflectionAlpha * 0.85})`);
    fadeG.addColorStop(0.45, `rgba(255,255,255,${reflectionAlpha})`);
    fadeG.addColorStop(1, `rgba(255,255,255,${reflectionAlpha * 0.42})`);
    rctx.fillStyle = fadeG;
    rctx.fillRect(0, 0, w, waterH);
    rctx.restore();

    const ctx = this.ctx;
    // Base clean paper-bright turquoise-cerulean water wash
    ctx.save();
    const baseGrad = ctx.createLinearGradient(0, horizonY, 0, h);
    baseGrad.addColorStop(0, rgba(tintTop, 0.46));
    baseGrad.addColorStop(0.55, rgba(tintDeep, 0.44));
    baseGrad.addColorStop(1, rgba(shadeTint, 0.52));
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = baseGrad;
    ctx.fillRect(0, horizonY, w, waterH);
    // Composite the entire silky reflection ONCE with multiply!
    ctx.drawImage(refl, 0, horizonY);
    ctx.restore();

    // Soft organic watercolor current strokes
    for (let i = 0; i < 18; i++) {
      const t = (i + 0.3) / 18;
      const y = horizonY + 18 + t * (waterH - 35) + this.rng.range(-10, 10);
      const x0 = this.rng.range(-80, w * 0.55);
      const len = this.rng.range(260, 680);
      this.stroke([
        [x0, y],
        [x0 + len * 0.33, y + this.rng.range(-8, 8)],
        [x0 + len * 0.66, y + this.rng.range(-8, 8)],
        [x0 + len, y],
      ], {
        color: i % 3 === 0 ? shadeTint : tintDeep,
        width: this.rng.range(10, 24) * (0.5 + t * 0.7),
        alpha: this.rng.range(0.12, 0.24),
        rimStroke: 0.06,
      });
    }

    // Glowing sunlit golden reflection shimmer path on the water
    this.glow(sunX, horizonY + waterH * 0.38, sunWidth, waterH * 0.46, sunColor, 0.44, 'multiply', -0.05);
    this.glow(sunX, horizonY + waterH * 0.32, sunWidth * 0.80, waterH * 0.38, '#FFFDF4', 0.64, 'screen', -0.05);

    // Dancing sunlit water sparkles
    for (let i = 0; i < 68; i++) {
      const t = Math.pow(this.rng.next(), 0.75);
      const y = horizonY + 12 + t * (waterH - 30);
      const spread = sunWidth * (0.35 + t * 0.85);
      const x = sunX + this.rng.gauss(0, spread * 0.45);
      const rx = this.rng.range(4, 22) * (0.45 + t * 0.85);
      const ry = Math.max(1.2, rx * this.rng.range(0.14, 0.28));
      this.reserve(ellipsePts(x, y, rx, ry, 10), '#FFFFFF', this.rng.range(0.45, 0.90));
    }

    // Soft sunlit atmospheric mist along the far shoreline so it blends poetically (no harsh horizontal bar!)
    this.glow(w * 0.5, horizonY + 2, w * 0.65, 26, '#FFFDF5', 0.46, 'screen');
  }

  // 5. Lush Hand-Painted Grass Blades & Wildflower Meadow Details
  paintGrassTuft(x, y, count = 9, height = 55, opts = {}) {
    const {
      colors = ['#5CA654', '#8AC75A', '#3D8453', '#C5DD62'],
      lean = 0.15,
      alpha = 0.70,
      width = 4.5,
    } = opts;
    for (let i = 0; i < count; i++) {
      const bx = x + this.rng.range(-18, 18);
      const h = height * this.rng.range(0.55, 1.25);
      const b = (lean + this.rng.range(-0.35, 0.35)) * h;
      this.stroke([
        [bx, y],
        [bx + b * 0.35, y - h * 0.45],
        [bx + b, y - h],
      ], {
        color: this.rng.pick(colors),
        width: width * this.rng.range(0.65, 1.3),
        alpha: alpha * this.rng.range(0.7, 1.05),
        taperStart: 0.75,
        taperEnd: 0.02,
        blur: 0.3,
        rimStroke: 0.12,
      });
    }
  }

  // 6. Delicate Water Ripples
  ripple(cx, cy, rx, ry, opts = {}) {
    const { light = '#FFFFFF', shadow = '#468BB0', alpha = 0.70, thickness = 2.0 } = opts;
    const drawRing = (yOff, col, a, w, comp) => {
      const ctx = this.ctx;
      ctx.save();
      ctx.globalCompositeOperation = comp;
      const [r, g, b] = hexToRgb(col);
      const segs = 44;
      for (let i = 0; i < segs; i++) {
        const a1 = (i / segs) * Math.PI * 2, a2 = ((i + 1) / segs) * Math.PI * 2;
        const gap = Math.sin(a1 * 2 + 0.5) * 0.35 + 0.65;
        if (gap < 0.36) continue;
        ctx.strokeStyle = `rgba(${r},${g},${b},${a * gap})`;
        ctx.lineWidth = w * (0.65 + 0.5 * Math.abs(Math.sin(a1)));
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a1) * rx, cy + yOff + Math.sin(a1) * ry);
        ctx.lineTo(cx + Math.cos(a2) * rx, cy + yOff + Math.sin(a2) * ry);
        ctx.stroke();
      }
      ctx.restore();
    };
    drawRing(1.8, shadow, alpha * 0.42, thickness * 1.15, 'multiply');
    drawRing(0, light, alpha * 0.88, thickness, 'source-over');
  }

  // 7. Restrained Watercolor Pigment Splatter
  splatter(cx, cy, radius, count, color, alpha = 0.38) {
    const [r, g, b] = hexToRgb(color);
    const ctx = this.ctx;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    for (let i = 0; i < count; i++) {
      const a = this.rng.range(0, Math.PI * 2);
      const d = Math.pow(this.rng.next(), 0.72) * radius;
      const rad = this.rng.range(0.9, 3.2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha * this.rng.range(0.4, 1.0)})`;
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(a) * d, cy + Math.sin(a) * d, rad, rad * this.rng.range(0.7, 1.3), a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ============================================================================
  // SINGLE-PASS OPTICAL WATERCOLOR PAPER & PIGMENT PHYSICS SHADER!
  //   1) Subtle wet-paper domain warp (~1.4px) so ALL edges organically follow paper fibers
  //   2) Cold-press 300gsm Arches paper tooth & granulation
  //   3) Subtle global coffee-ring pigment edge pooling
  //   4) Warm poetic storybook light & organic deckle paper margin
  // ============================================================================
  applyWatercolorPhysics(opts = {}) {
    const {
      warpStrength = 1.35,
      paperGrain = 0.095,
      granulation = 0.11,
      warmth = 0.06,
      marginFade = true,
    } = opts;

    const w = this.w, h = this.h;
    const srcImg = this.ctx.getImageData(0, 0, w, h);
    const src = srcImg.data;
    const dstImg = this.ctx.createImageData(w, h);
    const dst = dstImg.data;

    for (let y = 0; y < h; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) {
        // Multi-scale Arches cold-press paper tooth (valleys & cotton fibers)
        const dimple = this.noise1.fbm(x * 0.085, y * 0.085, 3);
        const fine = this.noise2.sample(x * 0.34, y * 0.34);
        const tooth = dimple * 0.65 + fine * 0.35; // 0..1

        // Subtle organic wet-paper domain warp (breaks digital smoothness!)
        const wx = (this.noise1.sample(x * 0.045, y * 0.045) - 0.5) * 2.0 * warpStrength;
        const wy = (this.noise2.sample(x * 0.045 + 31.7, y * 0.045 + 17.3) - 0.5) * 2.0 * warpStrength;

        const sx = Math.max(0, Math.min(w - 1, Math.round(x + wx)));
        const sy = Math.max(0, Math.min(h - 1, Math.round(y + wy)));
        const sp = (sy * w + sx) * 4;

        let r = src[sp];
        let g = src[sp + 1];
        let b = src[sp + 2];

        // Pigment density estimate (darker = heavier pigment = stronger granulation in paper valleys!)
        const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
        const pigment = 1.0 - lum;

        // Paper tooth relief + pigment granulation (pigment settles into valleys where tooth < 0.5)
        const paperMod = 1.0 + (tooth - 0.5) * paperGrain;
        const granMod = 1.0 - (0.5 - tooth) * pigment * granulation * 1.8;
        const totalMod = paperMod * granMod;

        r = Math.max(0, Math.min(255, r * totalMod));
        g = Math.max(0, Math.min(255, g * totalMod * 0.998));
        b = Math.max(0, Math.min(255, b * totalMod * 0.992));

        const dp = (row + x) * 4;
        dst[dp] = r;
        dst[dp + 1] = g;
        dst[dp + 2] = b;
        dst[dp + 3] = 255;
      }
    }
    this.ctx.putImageData(dstImg, 0, 0);

    // Subtle warm sunlit storybook atmosphere
    if (warmth > 0) {
      this.ctx.save();
      this.ctx.globalCompositeOperation = 'soft-light';
      this.ctx.fillStyle = `rgba(255, 240, 200, ${warmth})`;
      this.ctx.fillRect(0, 0, w, h);
      this.ctx.restore();
    }

    // Soft storybook cream-paper margin vignette
    if (marginFade) {
      this.ctx.save();
      const grad = this.ctx.createRadialGradient(
        w * 0.5, h * 0.5, Math.min(w, h) * 0.45,
        w * 0.5, h * 0.5, Math.hypot(w, h) * 0.58
      );
      grad.addColorStop(0, 'rgba(252,249,241,0)');
      grad.addColorStop(0.82, 'rgba(252,249,241,0.10)');
      grad.addColorStop(1, 'rgba(252,249,241,0.72)');
      this.ctx.fillStyle = grad;
      this.ctx.fillRect(0, 0, w, h);
      this.ctx.restore();
    }
  }
}

function xform(pts, cx, cy, scale, rot = 0, flipX = false) {
  const cos = Math.cos(rot), sin = Math.sin(rot), fx = flipX ? -1 : 1;
  return pts.map(([x, y]) => {
    const sx = x * scale * fx, sy = y * scale;
    return [cx + sx * cos - sy * sin, cy + sx * sin + sy * cos];
  });
}

// ============================================================================
// 1. ORIGAMI PAPER BOAT (Volumetric folds + cool sky shadow + warm water reflection)
// ============================================================================
function drawPaperBoat(st, cx, cy, scale = 1.0, opts = {}) {
  const { tilt = 0, flipX = false, sunFromRight = true, withRipples = true, waterTint = '#5CAEC9' } = opts;
  const T = (pts) => xform(pts, cx, cy, scale, tilt, flipX);

  // Rippled mirror reflection beneath boat
  st.wash(T([[-72, 9], [74, 9], [52, 36], [-48, 36]]), {
    color: '#D5E9EE', color2: waterTint, alpha: 0.40, layers: 5, variance: 0.14, blur: 3.5, rimStroke: 0,

    color: '#E6F1F2', alpha: 0.26, layers: 4, variance: 0.16, blur: 4.5, rimStroke: 0,

  st.stroke(T([[-62, 6], [-20, 9], [20, 9], [64, 5]]), {
    color: '#3B789E', width: 8 * scale, alpha: 0.42, blur: 1.8, rimStroke: 0,
  });

  // Crisp paper-white base
  st.reserve(T([[-82, -16], [-32, -16], [-2, -68], [32, -16], [84, -18], [54, 7], [-50, 7]]), PAL.boatPaper, 0.97, 0.3);

  // Interior shadow pocket
  st.wash(T([[-58, -14], [-22, -16], [24, -16], [60, -15], [32, -2], [-30, -2]]), {
    color: '#9DBCD9', color2: '#C8DCEB', alpha: 0.46, layers: 5, variance: 0.04, blur: 0.5, rimStroke: 0.18,
  });

  // Sail facets (cool periwinkle shade vs warm golden sunlit paper)
  st.wash(T([[-31, -12], [-2, -68], [0, -10]]), {
    color: sunFromRight ? PAL.boatShade : PAL.boatWarm,

  });
  st.wash(T([[0, -10], [-2, -68], [32, -12]]), {
    color: sunFromRight ? '#FDECC2' : PAL.boatShade,
    alpha: sunFromRight ? 0.25 : 0.42, layers: 5, variance: 0.04, blur: 0.4, rimStroke: 0.14,
  });

  // Hull facets + subtle turquoise water bounce on lower hull
  st.wash(T([[-82, -16], [0, -8], [0, 7], [-50, 7]]), {
    color: sunFromRight ? '#B6D0E3' : '#FBEAC6',
    alpha: sunFromRight ? 0.42 : 0.24, layers: 5, variance: 0.04, blur: 0.4, rimStroke: 0.20,
  });
  st.wash(T([[0, -8], [84, -18], [54, 7], [0, 7]]), {
    color: sunFromRight ? '#FCEBC4' : '#B6D0E3',
    alpha: sunFromRight ? 0.26 : 0.40, layers: 5, variance: 0.04, blur: 0.4, rimStroke: 0.15,
  });

  st.reserve(T([[-2, -68], [2, -66], [30, -13], [26, -12]]), '#FFFFFF', 0.78, 0.3);
  st.reserve(T([[6, -8], [82, -17], [78, -13], [6, -5]]), '#FFFFFF', 0.65, 0.3);

function drawFluffyDuckling(st, cx, cy, scale = 1.0, opts = {}) {
  const { facingRight = true, headTilt = 0, withRipples = true, sunFromRight = true } = opts;
  const flipX = !facingRight;
  const T = (pts) => xform(pts, cx, cy, scale, 0, flipX);
  const TH = (pts) => {
    const cos = Math.cos(headTilt), sin = Math.sin(headTilt), fx = flipX ? -1 : 1;
    return pts.map(([x, y]) => {
      const rx = x - 18, ry = y + 24;
      return [cx + (18 + rx * cos - ry * sin) * scale * fx, cy + (-24 + rx * sin + ry * cos) * scale];
    });
  };

  // Water reflection & contact shadow
  st.wash(T([[-58, 9], [52, 9], [36, 44], [-42, 38]]), {
    color: '#F5CA60', color2: '#5CB2CC', alpha: 0.36, layers: 5, variance: 0.16, blur: 4.5, rimStroke: 0,
  });
  st.stroke(T([[-54, 7], [-10, 11], [26, 10], [46, 6]]), {
    color: '#3B7DA4', width: 9 * scale, alpha: 0.42, blur: 2.0, rimStroke: 0,

  // Unified fluffy S-curve silhouette
  const headArc = TH([

  ]);
  const sil = [...headArc, ...bodyArc];

  st.reserve(sil, '#FFFDF3', 0.96, 1.0);

  // Value 1: Luminous buttercup-gold wash
  st.wash(sil, {
    color: PAL.duckSun, color2: PAL.duckMid, alpha: 0.86, layers: 8, variance: 0.06, blur: 0.9, rimStroke: 0.24,
  });

  // Value 2: Warm honey-ochre & luminous lilac-lavender belly/underwing shadow

    color: PAL.duckOchre, color2: PAL.duckShadow, alpha: 0.42, layers: 6, variance: 0.10, blur: 2.4, rimStroke: 0,

  const tufts = [

    T([[-66, -18], [-73, -24]]), T([[-62, -21], [-68, -27]]),

  }

  // Sunlit cream-gold rim light on forehead, back & chest
  if (sunFromRight) {

    st.glow(h1[0], h1[1], 14 * scale, 10 * scale, '#FFFDF6', 0.62, 'screen', -0.3);

  // Rosy coral cheek blush
  const ck = TH([[31, -41]])[0];

  if (withRipples) {

    st.ripple(cx - 12 * scale, cy + 10 * scale, 94 * scale, 17 * scale, { alpha: 0.38, thickness: 1.4 * scale });

function drawReedCluster(st, baseX, baseY, count = 8, height = 280, opts = {}) {
  const { lean = 0.2, colors = ['#98CA5E', '#58A258', '#3B7E52'], alpha = 0.68, blur = 0.4, width = 10 } = opts;
  for (let i = 0; i < count; i++) {
    const x0 = baseX + st.rng.range(-55, 55);
    const h = height * st.rng.range(0.62, 1.18);
    const bend = (lean + st.rng.range(-0.22, 0.22)) * h;
    st.stroke([
      [x0, baseY],
      [x0 + bend * 0.25, baseY - h * 0.35],
      [x0 + bend * 0.62, baseY - h * 0.70],
      [x0 + bend, baseY - h],
    ], {
      color: st.rng.pick(colors),
      width: width * st.rng.range(0.68, 1.25),
      alpha: alpha * st.rng.range(0.75, 1.08),
      taperStart: 0.65,
      taperEnd: 0.02,
      blur,
    });

}
function drawWillowBranch(st, startX, startY, length = 340, droop = 0.25, opts = {}) {
  const { colors = ['#A5D462', '#6EB358', '#4A9154'], alpha = 0.66, blur = 0.5, leafCount = 14 } = opts;
  const endX = startX + length * droop, endY = startY + length;
  const midX = (startX + endX) * 0.5 + st.rng.range(-18, 18), midY = (startY + endY) * 0.5;
  st.pencil([[startX, startY], [midX, midY], [endX, endY]], { color: '#587D49', width: 1.3, alpha: alpha * 0.72 });
  for (let i = 1; i <= leafCount; i++) {
    const t = i / (leafCount + 1);
    const lx = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * midX + t * t * endX;
    const ly = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * midY + t * t * endY;
    const side = i % 2 === 0 ? 1 : -1;
    const lLen = st.rng.range(28, 50);
    const ang = Math.PI * 0.5 + side * st.rng.range(0.30, 0.72);
    st.stroke([
      [lx, ly],
      [lx + Math.cos(ang) * lLen * 0.5, ly + Math.sin(ang) * lLen * 0.5],
      [lx + Math.cos(ang) * lLen, ly + Math.sin(ang) * lLen],
    ], {
      color: st.rng.pick(colors),
      width: st.rng.range(9, 14),
      alpha: alpha * st.rng.range(0.75, 1.08),
      taperStart: 0.15,
      taperEnd: 0.04,
      blur,
    });
  }
}
function drawWildflower(st, cx, cy, scale = 1.0, petalColor = '#FFFFFF', centerColor = '#FFC640') {
  // Delicate stem & tiny leaf grounding the flower into the meadow!
  st.stroke([[cx, cy + 4 * scale], [cx - 2 * scale, cy + 16 * scale], [cx + 1 * scale, cy + 26 * scale]], {
    color: '#4F944C', width: 2.4 * scale, alpha: 0.72, rimStroke: 0,

// Smooth easing helpers
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const smoothstep = (a, b, x) => {
  const t = clamp01((x - a) / (b - a));
  return t * t * (3 - 2 * t);
};
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp01(t), 3);
const easeInOutSine = (t) => -(Math.cos(Math.PI * clamp01(t)) - 1) / 2;
const lerp = (a, b, t) => a + (b - a) * t;

function xform(pts, cx, cy, scale, rot = 0, flipX = false) {
  const cos = Math.cos(rot), sin = Math.sin(rot), fx = flipX ? -1 : 1;
  return pts.map(([x, y]) => {
    const sx = x * scale * fx, sy = y * scale;
    return [cx + sx * cos - sy * sin, cy + sx * sin + sy * cos];
  });
}

  st.ctx.lineWidth = (2.4 + blink * 0.5) * scale;
  st.ctx.lineCap = 'round';
  st.ctx.beginPath();
  if (blink > 0.5) {
    st.ctx.moveTo(eyePt[0] - 4.5 * scale, eyePt[1]);
    st.ctx.quadraticCurveTo(eyePt[0], eyePt[1] + 2.5 * scale, eyePt[0] + 4.5 * scale, eyePt[1]);
  } else {
    st.ctx.arc(eyePt[0], eyePt[1] - 1.5 * scale, 4.8 * scale, 0.18 * Math.PI, 0.88 * Math.PI);
  }
  st.ctx.stroke();
  st.ctx.restore();
  st.pencil(TH([[43, -69], [49, -68], [54, -72]]), { color: '#C4685E', width: 1.35 * scale, alpha: 0.72, passes: 1 });

  const hairUnder = TH(sampleBezierShape([
    [[-34, -116], [-10, -124], [24, -122], [46, -112]],
    [[46, -112], [32, -108], [16, -110], [4, -92]],
    [[4, -92], [-2, -74], [-14, -56], [-32, -62]],
    [[-32, -62], [-42, -78], [-42, -100], [-34, -116]],
  ], 10));
  st.reserve(hairUnder, '#EBD6C0', 0.90);
  st.wash(hairUnder, { color: PAL.hairMid, color2: PAL.hairDeep, alpha: 0.86, layers: 5, variance: 0.04, rimStroke: 0.24 });

  const ear = TH(ellipsePts(1, -86, 6.6, 8.4, 10));
  st.reserve(ear, '#FFE4CE', 0.95);
  st.wash(ear, { color: PAL.skinShade, alpha: 0.40, layers: 3, rimStroke: 0 });

  // Sunlit straw sunhat
  const hatCrown = TH(sampleBezierShape([
    [[-44, -128], [-40, -168], [-8, -184], [24, -180]],
    [[24, -180], [50, -172], [58, -148], [52, -124]],
    [[52, -124], [24, -116], [-18, -118], [-44, -128]],
  ], 10));
  const hatFrontBrim = TH(sampleBezierShape([
    [[-64, -122], [-34, -136], [28, -138], [82, -118]],
    [[82, -118], [86, -108], [56, -102], [10, -108]],
    [[10, -108], [-38, -112], [-68, -112], [-64, -122]],
  ], 10));
  st.reserve(hatCrown, '#FFF8E2', 0.96);
  st.wash(hatCrown, { color: PAL.hatLight, color2: PAL.hatMid, alpha: 0.86, layers: 5, variance: 0.04, rimStroke: 0.28 });
  st.reserve(hatFrontBrim, '#FFF9E8', 0.96);
  st.wash(hatFrontBrim, { color: PAL.hatLight, color2: PAL.hatMid, alpha: 0.80, layers: 5, variance: 0.04, rimStroke: 0.26 });
  const hlHat = TH([[26, -162]])[0];
  st.glow(hlHat[0], hlHat[1], 30 * scale, 16 * scale, '#FFFDF5', 0.60, 'screen', 0.25);

  // Coral ribbon & gently fluttering ribbon tails!
  const fl1 = Math.sin(ribbonPhase) * 6;
  const fl2 = Math.cos(ribbonPhase * 1.2 + 0.8) * 5;
  st.stroke(TH([[-44, -132], [-8, -124], [26, -124], [52, -128]]), { color: PAL.ribbon, width: 10 * scale, alpha: 0.88, rimStroke: 0.20 });
  st.wash(TH(ellipsePts(-50, -134, 14, 7, 10, -0.4 + fl1 * 0.015)), { color: PAL.ribbon, color2: PAL.ribbonDeep, alpha: 0.88, layers: 3, rimStroke: 0.22 });
  st.wash(TH(ellipsePts(-54, -122, 13, 6.5, 10, 0.45 + fl2 * 0.015)), { color: PAL.ribbon, color2: PAL.ribbonDeep, alpha: 0.88, layers: 3, rimStroke: 0.22 });
  st.stroke(TH([[-48, -128], [-68 + fl1 * 0.5, -104], [-78 + fl1, -82]]), { color: PAL.ribbon, width: 7 * scale, alpha: 0.84 });
  st.stroke(TH([[-46, -126], [-58 + fl2 * 0.5, -98], [-62 + fl2, -76]]), { color: PAL.ribbonDeep, width: 6 * scale, alpha: 0.78 });

  // Clean pencil accents
  const lp = { color: PAL.sepia, width: 1.3 * scale, alpha: 0.44, jitter: 0.22 * scale, passes: 1 };
  const bp = { color: PAL.indigo, width: 1.3 * scale, alpha: 0.42, jitter: 0.22 * scale, passes: 1 };
  st.pencil(TH(sampleCubic([50, -104], [56, -92], [60, -87], [55, -82], 8)), lp);
  st.pencil(TH(sampleCubic([55, -82], [52, -72], [44, -58], [24, -50], 8)), lp);

  st.pencil(T(sampleCubic([-42, -36], [-78, -4], [-94, 40], [-84, 70], 10)), bp);
  st.pencil(T(sampleCubic([-84, 70], [-64, 88], [-22, 86], [10, 72], 10)), bp);

  st.pencil(TA(sampleCubic([136, 106], [100, 108], [46, 78], [8, 52], 10)), { ...lp, alpha: 0.36 });
  st.pencil(T(sampleCubic([36, 68], [42, 84], [22, 118], [2, 142], 10)), lp);
}

// ============================================================================
// FILM DIRECTOR: Caches each shot's painted upper landscape & paper LUT ONCE,
// then renders live animated water reflections, swaying willows, ripples & characters!
// ============================================================================
class PaperBoatFilm {
  constructor(width = 1600, height = 900) {
    this.w = width;
    this.h = height;

    // Precompute cold-press Arches 300gsm paper tooth & domain-warp LUT ONCE (massive speedup & zero flicker!)
    this.paperMod = new Float32Array(width * height);
    this.granMod = new Float32Array(width * height);
    this.warpIdx = new Int32Array(width * height);
    this._precomputePaperLUT();

    // Scratch buffers for two-shot cross-dissolve & final compositing
    this.bufA = document.createElement('canvas');
    this.bufA.width = width;
    this.bufA.height = height;
    this.bufB = document.createElement('canvas');
    this.bufB.width = width;
    this.bufB.height = height;

    this.shots = {};
    this._buildShotCaches();
  }


  _precomputePaperLUT() {
    const w = this.w, h = this.h;
    this.paperOverlay = document.createElement('canvas');
    this.paperOverlay.width = w;
    this.paperOverlay.height = h;
    const pctx = this.paperOverlay.getContext('2d');
    const img = pctx.createImageData(w, h);
    const d = img.data;
    const dummy = document.createElement('canvas');
    dummy.width = 4; dummy.height = 4;
    const st = new WatercolorStudio(dummy, 2026);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const dimple = st.noise1.fbm(x * 0.085, y * 0.085, 3);
        const fine = st.noise2.sample(x * 0.34, y * 0.34);
        const tooth = dimple * 0.65 + fine * 0.35;
        const v = Math.max(0, Math.min(255, Math.round(244 + (tooth - 0.5) * 28)));
        const p = (y * w + x) * 4;
        d[p] = v;
        d[p + 1] = Math.round(v * 0.996);
        d[p + 2] = Math.round(v * 0.985);
        d[p + 3] = 255;
      }
    }
    pctx.putImageData(img, 0, 0);
  }

  _applyFastPaperPhysics(canvas, warmth = 0.06) {
    const w = this.w, h = this.h;
    const ctx = canvas.getContext('2d');
    // Hardware-accelerated cold-press Arches paper grain overlay
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.85;
    ctx.drawImage(this.paperOverlay, 0, 0);
    ctx.restore();

    if (warmth > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = `rgba(255, 240, 200, ${warmth})`;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
    }
    // Storybook deckle margin vignette
    ctx.save();
    const grad = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.45, w * 0.5, h * 0.5, Math.hypot(w, h) * 0.58);
    grad.addColorStop(0, 'rgba(252,249,241,0)');
    grad.addColorStop(0.84, 'rgba(252,249,241,0.10)');
    grad.addColorStop(1, 'rgba(252,249,241,0.70)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  _buildShotCaches() {
    // Shot 1 upper sky/trees + left meadow bank cache
    this.shots.s1 = this._cacheShot1();
    this.shots.s2 = this._cacheShot2();
    this.shots.s3 = this._cacheShot3();
    this.shots.s4 = this._cacheShot4();
  }

  _makeCanvas() {
    const c = document.createElement('canvas');
    c.width = this.w; c.height = this.h;
    return c;
  }

  _cacheShot1() {
    const skyC = this._makeCanvas();
    const st = new WatercolorStudio(skyC, 5011);
    const horizonY = 335;
    st.paintSky(horizonY, { topColor: '#86C7E8', midColor: '#C8EAF6', horizonColor: '#FFF3C4', sunX: 1290, sunY: 115, sunColor: '#FFE082', cloudCount: 4 });
    st.paintDistantHills(horizonY, [
      { color: '#9CC6C2', color2: '#89B5C4', alpha: 0.42, amp: 58, yOff: -12, freq: 0.0024, phase: 0.5 },
      { color: '#8EC47E', color2: '#6DAA6E', alpha: 0.58, amp: 36, yOff: 2, freq: 0.0038, phase: 2.1 },
    ]);
    st.paintTree(1060, horizonY + 8, 1.02, { sunFromRight: true, alpha: 0.78, lean: -18 });
    st.paintTree(1380, horizonY + 10, 1.24, { sunFromRight: true, alpha: 0.82, lean: 22 });
    st.paintTree(795, horizonY + 5, 0.76, { sunFromRight: true, alpha: 0.62, lean: 14 });
    st.paintTree(235, horizonY + 6, 0.92, { sunFromRight: true, alpha: 0.72, lean: -12 });

    // Pre-paint static left wildflower meadow bank on transparent layer
    const bankC = this._makeCanvas();
    const bst = new WatercolorStudio(bankC, 5019);
    bst.ctx.clearRect(0, 0, this.w, this.h);
    const bankPts = [[-40, 310], [290, 322], [560, 370], [678, 455], [642, 595], [510, 750], [345, 920], [-40, 920]];
    bst.reserve(bankPts, '#FCF9EE', 0.98);
    bst.wash(bankPts, { color: '#A5D462', color2: '#63AB56', alpha: 0.76, layers: 7, variance: 0.06, rimStroke: 0.26 });
    bst.glow(380, 440, 260, 140, '#E8E46E', 0.40, 'multiply');
    bst.glow(160, 680, 240, 160, '#4E8F5C', 0.28, 'multiply');
    for (let i = 0; i < 30; i++) {
      const gx = bst.rng.range(30, 610), gy = bst.rng.range(360, 880);
      if (gx + (gy - 360) * 0.44 > 700) continue;
      bst.paintGrassTuft(gx, gy, bst.rng.range(5, 9), bst.rng.range(30, 66), { lean: 0.16, alpha: 0.66, width: 4.2 });
    }
    bst.paintGrassTuft(655, 455, 8, 52, { lean: 0.35, alpha: 0.72, width: 4.5 });
    bst.paintGrassTuft(632, 575, 7, 46, { lean: 0.32, alpha: 0.68, width: 4.2 });
    bst.paintGrassTuft(520, 725, 8, 54, { lean: 0.28, alpha: 0.68, width: 4.5 });
    bst.paintGrassTuft(410, 835, 9, 60, { lean: 0.24, alpha: 0.70, width: 4.8 });
    drawRiverStone(bst, 610, 495, 46, 24, { rot: 0.14, moss: true, inWater: false });
    drawRiverStone(bst, 550, 635, 58, 26, { rot: -0.08, moss: true, inWater: false });
    const flowers = [
      [145, 560, 1.2, '#FFFFFF', '#FFC53D'], [195, 612, 1.0, '#FFE47A', '#E88E38'],
      [110, 660, 1.05, '#A6D2FF', '#FFE066'], [265, 745, 1.2, '#FFFFFF', '#FFC53D'],
      [455, 540, 0.95, '#FFD1CC', '#FFE066'], [355, 705, 1.0, '#A6D2FF', '#FFE066'],
      [225, 485, 0.95, '#FFFFFF', '#FFC53D'], [88, 760, 1.15, '#FFE47A', '#E88E38'],
    ];
    for (const [fx, fy, fs, fc, cc] of flowers) drawWildflower(bst, fx, fy, fs, fc, cc);

    return { skyC, bankC, horizonY };
  }

  _cacheShot2() {

    const horizonY = 275;
    st.paintSky(horizonY, { topColor: '#82BFE0', midColor: '#C2E4F0', horizonColor: '#FFF0C2', sunX: 1420, sunY: 145, sunColor: '#FFE080', cloudCount: 2 });
    st.paintDistantHills(horizonY, [
      { color: '#82B6B0', color2: '#6CA2AE', alpha: 0.48, amp: 52, yOff: -8, freq: 0.0026, phase: 1.2 },
      { color: '#5E9E6E', color2: '#468462', alpha: 0.65, amp: 38, yOff: 4, freq: 0.0036, phase: 2.8 },

  _cacheShot3() {

    const st = new WatercolorStudio(skyC, 5033);
    const horizonY = 290;
    st.paintSky(horizonY, { topColor: '#88C9E6', midColor: '#CCEBF6', horizonColor: '#FFEBB8', sunX: 1320, sunY: 115, sunColor: '#FFD670', cloudCount: 3 });
    st.paintDistantHills(horizonY, [
      { color: '#96C4BC', color2: '#82B2BF', alpha: 0.42, amp: 48, yOff: -6, freq: 0.0025, phase: 0.8 },
      { color: '#78B674', color2: '#5B9D68', alpha: 0.56, amp: 32, yOff: 4, freq: 0.0038, phase: 2.0 },
    ]);
    st.paintTree(210, horizonY + 10, 1.18, { sunFromRight: true, alpha: 0.80, lean: -14 });
    st.paintTree(520, horizonY + 6, 0.88, { sunFromRight: true, alpha: 0.62, lean: 16 });

  }

  _cacheShot4() {
    const skyC = this._makeCanvas();
    const st = new WatercolorStudio(skyC, 5044);
    const horizonY = 330;
    st.paintSky(horizonY, { topColor: '#98D0E8', midColor: '#FDE8B6', horizonColor: '#FFD6A2', sunX: 1185, sunY: 185, sunColor: '#FFCE68', cloudCount: 3 });
    st.glow(1340, 160, 360, 220, '#FFB085', 0.34, 'multiply');
    st.paintDistantHills(horizonY, [
      { color: '#A5C6B8', color2: '#B8B8C8', alpha: 0.38, amp: 52, yOff: -10, freq: 0.0022, phase: 0.4 },
      { color: '#8CC07E', color2: '#B8C87A', alpha: 0.48, amp: 28, yOff: 2, freq: 0.0034, phase: 1.9 },
    ]);
    st.paintTree(180, horizonY + 8, 1.15, { sunFromRight: true, alpha: 0.72, lean: -12 });
    st.paintTree(465, horizonY + 5, 0.78, { sunFromRight: true, alpha: 0.52, lean: 15 });
    st.paintTree(1495, horizonY + 6, 0.90, { sunFromRight: true, alpha: 0.56, midCol: '#9CC468', lightCol: '#E8DC72', lean: -16 });
    return { skyC, horizonY };
  }

  // Live animated silky mirror-reflection stream (zero scanlines, continuous gentle ripple motion!)
  _drawLiveWater(st, skyC, horizonY, timeSec, opts) {
    const { tintTop, tintDeep, shadeTint, sunX, sunWidth, sunColor, reflectionAlpha = 0.44, rippleAmp = 12 } = opts;
    const w = this.w, h = this.h, waterH = h - horizonY;
    const ctx = st.ctx;

    // 1. Copy cached upper landscape
    ctx.drawImage(skyC, 0, 0, w, horizonY, 0, 0, w, horizonY);

    // 2. Build live animated silky reflection on offscreen canvas
    if (!this._reflC) {
      this._reflC = document.createElement('canvas');
      this._reflC.width = w;
    }
    this._reflC.height = waterH;
    const rctx = this._reflC.getContext('2d');
    rctx.clearRect(0, 0, w, waterH);
    const sliceH = 3;
    const phase = timeSec * 2.1;
    for (let y = 0; y < waterH; y += sliceH) {
      const t = y / waterH;
      const srcY = Math.max(0, Math.min(horizonY - sliceH, horizonY - 2 - Math.floor(y * 0.72)));
      const wave = Math.sin(y * 0.065 - phase + t * 5.0) * (rippleAmp * (0.22 + t * 0.92))
                 + Math.sin(y * 0.16 + phase * 1.4) * (rippleAmp * 0.22);
      rctx.drawImage(skyC, 0, srcY, w, sliceH, wave, y, w, sliceH);
    }
    rctx.save();
    rctx.globalCompositeOperation = 'destination-in';
    const fadeG = rctx.createLinearGradient(0, 0, 0, waterH);
    fadeG.addColorStop(0, `rgba(255,255,255,${reflectionAlpha * 0.85})`);
    fadeG.addColorStop(0.45, `rgba(255,255,255,${reflectionAlpha})`);
    fadeG.addColorStop(1, `rgba(255,255,255,${reflectionAlpha * 0.42})`);
    rctx.fillStyle = fadeG;
    rctx.fillRect(0, 0, w, waterH);
    rctx.restore();

    // 3. Base turquoise-cerulean water wash + silky reflection
    ctx.save();
    ctx.fillStyle = '#FCF9F1';
    ctx.fillRect(0, horizonY, w, waterH);
    const baseGrad = ctx.createLinearGradient(0, horizonY, 0, h);
    baseGrad.addColorStop(0, rgba(tintTop, 0.46));
    baseGrad.addColorStop(0.55, rgba(tintDeep, 0.44));
    baseGrad.addColorStop(1, rgba(shadeTint, 0.52));
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = baseGrad;
    ctx.fillRect(0, horizonY, w, waterH);
    ctx.drawImage(this._reflC, 0, horizonY);
    ctx.restore();

    // 4. Gently drifting current ribbons
    for (let i = 0; i < 12; i++) {
      const u = (i + 0.35) / 12;
      const y = horizonY + 24 + u * (waterH - 42);
      const drift = (timeSec * (28 + (i % 4) * 9) + i * 210) % (w + 520) - 260;
      const len = 320 + (i % 3) * 110;
      st.stroke([
        [drift, y],
        [drift + len * 0.33, y + Math.sin(i + timeSec) * 6],
        [drift + len * 0.66, y - Math.sin(i + timeSec * 0.9) * 6],
        [drift + len, y],
      ], { color: i % 3 === 0 ? shadeTint : tintDeep, width: 12 + u * 12, alpha: 0.16, rimStroke: 0 });
    }

    // 5. Sunlit golden water shimmer & animated twinkling sparkles!
    st.glow(sunX, horizonY + waterH * 0.38, sunWidth, waterH * 0.46, sunColor, 0.44, 'multiply', -0.05);
    st.glow(sunX, horizonY + waterH * 0.32, sunWidth * 0.80, waterH * 0.38, '#FFFDF4', 0.64, 'screen', -0.05);

    for (let i = 0; i < 52; i++) {
      const seed = i * 97.13;
      const u = (Math.sin(seed) * 0.5 + 0.5);
      const y = horizonY + 14 + Math.pow(u, 0.85) * (waterH - 32);
      const spread = sunWidth * (0.32 + u * 0.88);
      const x = sunX + Math.sin(seed * 1.7) * spread * 0.65 + Math.sin(timeSec * 0.9 + i) * 8;
      const twinkle = 0.45 + 0.55 * Math.sin(timeSec * (2.2 + (i % 5) * 0.5) + i * 1.9);
      if (twinkle < 0.18) continue;
      const rx = (5 + (i % 7) * 2.4) * (0.45 + u * 0.80) * (0.7 + twinkle * 0.4);
      const ry = Math.max(1.2, rx * 0.22);
      st.reserve(ellipsePts(x, y, rx, ry, 8), '#FFFFFF', 0.35 + twinkle * 0.55);
    }

    // Soft sunlit shoreline mist
    st.glow(w * 0.5, horizonY + 2, w * 0.65, 26, '#FFFDF5', 0.46, 'screen');
  }

  // Apply gentle camera zoom & pan (smooth Ken Burns feel!)
  _applyCamera(ctx, zoom, panX, panY, drawFn) {
    ctx.save();
    ctx.translate(this.w * 0.5 + panX, this.h * 0.5 + panY);
    ctx.scale(zoom, zoom);
    ctx.translate(-this.w * 0.5, -this.h * 0.5);
    drawFn();
    ctx.restore();
  }

  // ---- SHOT 1: 入水与启程 (0.0s – 7.5s) ----
  _renderShot1(targetCanvas, tLocal, tGlobal) {
    const st = new WatercolorStudio(targetCanvas, 1001);
    const { skyC, bankC, horizonY } = this.shots.s1;
    const p = clamp01(tLocal / 7.5);
    const zoom = lerp(1.14, 1.00, easeInOutSine(p));
    const panX = lerp(90, -15, easeInOutSine(p));
    const panY = lerp(-45, 0, easeInOutSine(p));

    this._applyCamera(st.ctx, zoom, panX, panY, () => {
      this._drawLiveWater(st, skyC, horizonY, tGlobal, {
        tintTop: '#9CE0E2', tintDeep: '#55ABC9', shadeTint: '#4D8BB8',
        sunX: 1280, sunWidth: 360, sunColor: '#FFD96B', reflectionAlpha: 0.44, rippleAmp: 11,
      });
      // Static left wildflower bank
      st.ctx.drawImage(bankC, 0, 0);

      // Child animation: gently lowers boat (0..2.1s), releases at 2.1s, retracts slightly, blinks at 3.8s
      const lowerT = smoothstep(0.0, 2.1, tLocal);
      const retractT = smoothstep(2.2, 4.2, tLocal);
      const armLift = lerp(-0.85, 0.0, lowerT) + lerp(0.0, -0.45, retractT);
      const headTilt = lerp(0.28, 0.20, smoothstep(2.4, 6.8, tLocal));
      const blink = (Math.abs(tLocal - 3.9) < 0.14 || Math.abs(tLocal - 6.2) < 0.12) ? 1 : 0;

      drawAnimatedChild(st, 465, 475, 1.65, {
        armLift,
        headTilt,
        ribbonPhase: tGlobal * 2.2,
        blink,
      });

      // Paper boat: held gently -> touches water at 2.1s with damped splash dip -> drifts smoothly rightward!
      const driftT = smoothstep(2.15, 7.5, tLocal);
      const boatX = 768 + driftT * 470;
      let boatY = 648;
      let boatTilt = 0.03;
      if (tLocal < 2.1) {
        boatY = 648 - (1 - lowerT) * 28;
        boatTilt = -0.05 * (1 - lowerT);
      } else {
        const dt = tLocal - 2.1;
        const dip = Math.exp(-dt * 2.6) * Math.sin(dt * 7.5) * 9.5;
        boatY = 648 + dip + Math.sin(tGlobal * 2.4) * 3.2 - driftT * 26;
        boatTilt = Math.sin(tGlobal * 2.0 + 0.5) * 0.045 + Math.exp(-dt * 2.2) * 0.06;
      }

      drawPaperBoat(st, boatX, boatY, lerp(1.28, 1.12, driftT), {
        tilt: boatTilt, sunFromRight: true, withRipples: tLocal >= 2.0,
      });

      // Expanding launch ripples blooming right after touchdown (2.1s..5.5s)!
      if (tLocal >= 2.05) {
        const rt = tLocal - 2.05;
        for (let k = 0; k < 3; k++) {
          const age = rt - k * 0.55;
          if (age > 0 && age < 3.4) {
            const u = age / 3.4;
            st.ripple(772 + u * 25, 656, 85 + u * 220, 15 + u * 38, { alpha: (1 - u) * 0.65, thickness: 2.0 * (1 - u * 0.4) });
          }
        }
      }

      // Gently swaying overhanging willow branches
      const sway = Math.sin(tGlobal * 1.35) * 0.05;
      drawWillowBranch(st, 1345, -15, 340, -0.18 + sway, { alpha: 0.60, leafCount: 13 });
      drawWillowBranch(st, 1465, -20, 290, -0.12 + sway * 1.2, { alpha: 0.50, leafCount: 11 });
      drawWillowBranch(st, 95, -15, 250, 0.16 + sway * 0.8, { alpha: 0.46, leafCount: 9 });
    });

    // Poetic opening title card fading softly in the upper-right sunlit sky (0.4s..3.8s)
    const titleAlpha = smoothstep(0.4, 1.3, tLocal) * (1 - smoothstep(2.9, 4.0, tLocal));
    if (titleAlpha > 0.01) {
      const ctx = st.ctx;
      ctx.save();
      ctx.globalAlpha = titleAlpha;
      ctx.fillStyle = '#5C4334';
      ctx.font = '500 54px "STKaiti", "KaiTi", "SimSun", "Georgia", serif';
      ctx.textAlign = 'center';
      ctx.fillText('纸船的故事', 1120, 185);
      ctx.font = 'italic 22px "Georgia", serif';
      ctx.fillStyle = '#7E6454';
      ctx.fillText('The Story of a Paper Boat', 1120, 224);
      ctx.restore();
    }
  }

  // ---- SHOT 2: 林荫漂流与小停顿 (7.5s – 14.5s) ----
  _renderShot2(targetCanvas, tLocal, tGlobal) {
    const st = new WatercolorStudio(targetCanvas, 2002);
    const { skyC, horizonY } = this.shots.s2;
    const p = clamp01(tLocal / 7.0);
    const zoom = lerp(1.06, 1.00, easeOutCubic(p));
    const panX = lerp(35, -10, easeOutCubic(p));

    this._applyCamera(st.ctx, zoom, panX, 0, () => {
      this._drawLiveWater(st, skyC, horizonY, tGlobal, {
        tintTop: '#8BD5DC', tintDeep: '#4B9AC0', shadeTint: '#4876A8',
        sunX: 1420, sunWidth: 280, sunColor: '#FFD86B', reflectionAlpha: 0.48, rippleAmp: 10,
      });

      // Gently undulating underwater emerald weeds
      for (let i = 0; i < 6; i++) {
        const wx = 160 + i * 245;
        const wy = 660 + (i % 3) * 70;
        const wSway = Math.sin(tGlobal * 1.4 + i) * 14;
        st.stroke([[wx, wy], [wx + 55, wy - 24 + wSway * 0.4], [wx + 125, wy - 10 + wSway * 0.8], [wx + 180, wy - 32 + wSway]], {
          color: '#388568', width: 15, alpha: 0.25, rimStroke: 0,
        });
      }

      // Mossy river stones
      drawRiverStone(st, 430, 520, 142, 70, { rot: -0.08, moss: true });
      drawRiverStone(st, 240, 620, 112, 54, { rot: 0.12, moss: true });
      drawRiverStone(st, 585, 585, 52, 25, { rot: 0.15, moss: true });

      // Boat drifts smoothly in from left (0..3.4s), gently bumps willow leaf at 3.4s, then bobs & hesitates!
      const arriveT = easeOutCubic(clamp01(tLocal / 3.5));
      const bump = smoothstep(3.3, 4.6, tLocal);
      const pauseWobble = bump * Math.sin((tLocal - 3.3) * 2.1) * 9;
      const boatX = lerp(355, 792, arriveT) + pauseWobble;
      const boatY = 545 + Math.sin(tGlobal * 2.3) * 3.5 + Math.cos(tLocal * 1.4) * 2.0;
      const boatTilt = -0.06 + Math.sin(tGlobal * 1.8) * 0.055;

      // Floating willow leaf gently nudged when boat arrives
      const leafX = 625 + bump * 12 + Math.sin(tGlobal * 1.5) * 3;
      const leafY = 562 + Math.cos(tGlobal * 1.7) * 2.5;
      drawFloatingLeaf(st, leafX, leafY, 1.35, -0.22 + bump * 0.12 + Math.sin(tGlobal * 1.2) * 0.04);

      drawPaperBoat(st, boatX, boatY, 1.48, { tilt: boatTilt, sunFromRight: true, withRipples: true, waterTint: '#4B9AC0' });

      // Subtle swirling eddy ripple around paused boat
      if (tLocal > 3.1) {
        const u = ((tLocal - 3.1) % 2.4) / 2.4;
        st.ripple(750, 575, 115 + u * 130, 22 + u * 26, { alpha: (1 - u) * 0.45, shadow: '#3E7EA8', thickness: 1.6 });
      }

      // Gently swaying reeds & hanging willow curtains
      const sway = Math.sin(tGlobal * 1.25) * 0.055;
      drawReedCluster(st, 130, 695, 9, 365, { lean: 0.22 + sway, alpha: 0.72, width: 12 });
      drawReedCluster(st, 1365, 465, 7, 235, { lean: -0.15 + sway, alpha: 0.60, width: 9 });
      drawWillowBranch(st, 260, -20, 410, 0.18 + sway, { alpha: 0.68, leafCount: 14 });
      drawWillowBranch(st, 450, -25, 330, 0.24 + sway * 1.15, { alpha: 0.58, leafCount: 12 });
      drawReedCluster(st, 65, 940, 5, 255, { lean: 0.35 + sway, colors: ['#3B7E52', '#2E6648'], alpha: 0.52, width: 20 });
    });
  }

  // ---- SHOT 3: 偶遇与轻推 (14.5s – 22.5s) [HERO EMOTIONAL CLIMAX] ----
  _renderShot3(targetCanvas, tLocal, tGlobal) {
    const st = new WatercolorStudio(targetCanvas, 3003);
    const { skyC, horizonY } = this.shots.s3;
    const p = clamp01(tLocal / 8.0);
    const zoom = lerp(1.05, 1.00, easeInOutSine(p));
    const panX = lerp(28, -32, smoothstep(3.6, 8.0, tLocal));

    this._applyCamera(st.ctx, zoom, panX, 0, () => {
      this._drawLiveWater(st, skyC, horizonY, tGlobal, {
        tintTop: '#96DCE0', tintDeep: '#54AAC8', shadeTint: '#4A84B0',
        sunX: 1290, sunWidth: 380, sunColor: '#FFD666', reflectionAlpha: 0.44, rippleAmp: 12,
      });

      // Warm diagonal golden sunbeam breathing gently
      st.glow(1180, 440, 390, 480, '#FFF2BA', 0.32 + Math.sin(tGlobal * 1.1) * 0.04, 'screen', -0.34);

      drawRiverStone(st, 220, 685, 122, 56, { rot: 0.06, moss: true });
      drawFloatingLeaf(st, 1085 + Math.sin(tGlobal * 1.3) * 5, 655 + Math.cos(tGlobal * 1.5) * 3, 1.15, 0.18 + Math.sin(tGlobal) * 0.04);

      const sway = Math.sin(tGlobal * 1.3) * 0.05;
      drawReedCluster(st, 185, 530, 10, 355, { lean: 0.24 + sway, alpha: 0.66, width: 12 });
      drawReedCluster(st, 355, 445, 7, 260, { lean: 0.18 + sway, alpha: 0.50, width: 10 });

      // HERO CHOREOGRAPHY:
      // 0.0..2.2s: Duckling swims in from left reeds (x: 240 -> 595)
      // 2.2..3.5s: Curious pause & adorable head tilt!
      // 3.5..4.3s: Duckling paddles forward & gently nudges paper boat stern at tLocal = 4.1s!
      // 4.1..8.0s: Paper boat rocks forward & glides gracefully into the golden sunlight!
      const swimIn = easeOutCubic(clamp01(tLocal / 2.3));
      const nudgeApproach = smoothstep(3.4, 4.15, tLocal);
      const nudgeFollow = smoothstep(4.15, 5.4, tLocal);
      const duckX = lerp(240, 595, swimIn) + nudgeApproach * 58 - nudgeFollow * 12;
      const duckY = 578 + Math.sin(tGlobal * 3.1) * 3.8;

      let headTilt = 0.02;
      if (tLocal >= 2.0 && tLocal < 3.4) {
        // Curious head-tilt back then forward!
        headTilt = -0.16 * Math.sin(((tLocal - 2.0) / 1.4) * Math.PI);
      } else if (tLocal >= 3.4 && tLocal < 5.0) {
        // Tender forward nudge with bill!
        headTilt = 0.22 * Math.sin(clamp01((tLocal - 3.4) / 1.5) * Math.PI);
      } else if (tLocal >= 5.0) {
        // Proudly watching boat sail away
        headTilt = lerp(0.0, -0.08, smoothstep(5.0, 6.8, tLocal));
      }

      const glideT = easeInOutSine(clamp01((tLocal - 4.05) / 3.95));
      const boatX = 895 + glideT * 365 + (tLocal < 4.05 ? Math.sin(tGlobal * 1.9) * 5 : 0);
      const boatY = 540 + Math.sin(tGlobal * 2.4 + 0.7) * 3.5 - glideT * 18;
      let boatTilt = Math.sin(tGlobal * 2.0) * 0.03;
      if (tLocal >= 4.0 && tLocal < 6.0) {
        const dt = tLocal - 4.0;
        boatTilt += Math.exp(-dt * 2.0) * Math.sin(dt * 5.2) * 0.13;
      }

      drawFluffyDuckling(st, duckX, duckY, 2.05, { facingRight: true, headTilt, withRipples: true, sunFromRight: true });
      drawPaperBoat(st, boatX, boatY, 1.62, { tilt: boatTilt, sunFromRight: true, withRipples: true, waterTint: '#54AAC8' });

      // Tender contact ripple blooming right where bill touches stern (tLocal >= 4.05s)!
      if (tLocal >= 4.0) {
        const rt = tLocal - 4.0;
        for (let k = 0; k < 2; k++) {
          const age = rt - k * 0.45;
          if (age > 0 && age < 2.8) {
            const u = age / 2.8;
            st.ripple(788 + u * 35, 558, 35 + u * 185, 8 + u * 32, { alpha: (1 - u) * 0.80, thickness: 2.2 * (1 - u * 0.35) });
          }
        }
      }

      // Framing willow & foreground reeds
      drawWillowBranch(st, 140, -15, 320, 0.20 + sway, { alpha: 0.60, leafCount: 12 });
      drawReedCluster(st, 75, 935, 6, 285, { lean: 0.30 + sway, colors: ['#4A9154', '#38764C'], alpha: 0.50, width: 22 });
      drawReedCluster(st, 1525, 945, 4, 215, { lean: -0.25 + sway, colors: ['#B0D460', '#74B254'], alpha: 0.42, width: 18 });
    });
  }

  // ---- SHOT 4: 驶向阳光 (22.5s – 30.0s) [POETIC FINALE] ----
  _renderShot4(targetCanvas, tLocal, tGlobal) {
    const st = new WatercolorStudio(targetCanvas, 4004);
    const { skyC, horizonY } = this.shots.s4;
    const p = clamp01(tLocal / 7.5);
    const zoom = lerp(1.07, 0.99, easeInOutSine(p));
    const panY = lerp(-18, 12, easeInOutSine(p));

    this._applyCamera(st.ctx, zoom, 0, panY, () => {
      this._drawLiveWater(st, skyC, horizonY, tGlobal, {
        tintTop: '#A4E0DE', tintDeep: '#5FB2CE', shadeTint: '#4D8BB8',
        sunX: 1165, sunWidth: 440, sunColor: '#FFD266', reflectionAlpha: 0.48, rippleAmp: 12,
      });
      st.glow(1100, 620, 420, 210, '#FFC478', 0.34, 'multiply', 0.04);
      st.glow(280, 720, 390, 210, '#4684AE', 0.28, 'multiply');

      // Paper boat sailing gracefully toward the glowing golden horizon!
      const sail = easeInOutSine(p);
      const boatX = lerp(850, 1185, sail);
      const boatY = lerp(522, 428, sail) + Math.sin(tGlobal * 2.2) * 2.2;
      const boatScale = lerp(0.86, 0.44, sail);

      // Shimmering undulating twin white V-wake trailing smoothly behind the boat
      st.ctx.save();
      st.ctx.globalCompositeOperation = 'screen';
      st.ctx.lineCap = 'round';
      const drawWake = (dx1, dy1, dx2, dy2, bw, ba) => {
        const steps = 6;
        for (let i = 0; i < steps; i++) {
          const t0 = i / steps, t1 = (i + 1) / steps;
          const x0 = boatX + dx1 * t0 + Math.sin(tGlobal * 2.5 + i) * 2.5;
          const y0 = boatY + 8 * boatScale + dy1 * t0;
          const x1 = boatX + dx1 * t1 + Math.sin(tGlobal * 2.5 + i + 1) * 2.5;
          const y1 = boatY + 8 * boatScale + dy1 * t1;
          st.ctx.strokeStyle = `rgba(255,254,248,${ba * (1 - t0) * (1 - t0 * 0.4)})`;
          st.ctx.lineWidth = Math.max(0.7, bw * (1 - t0 * 0.65));
          st.ctx.beginPath();
          st.ctx.moveTo(x0, y0);
          st.ctx.lineTo(x1, y1);
          st.ctx.stroke();
        }
      };
      drawWake(-230 * boatScale, 88 * boatScale, 0, 0, 3.0, 0.78);
      drawWake(-165 * boatScale, 128 * boatScale, 0, 0, 2.8, 0.68);
      st.ctx.restore();

      drawPaperBoat(st, boatX, boatY, boatScale, {
        tilt: -0.03 + Math.sin(tGlobal * 1.9) * 0.025, sunFromRight: true, withRipples: true, waterTint: '#F2CC74',
      });
      st.glow(boatX, boatY - 6, 105 * boatScale + 35, 60 * boatScale + 20, '#FFFDF5', 0.56, 'screen');

      // Duckling in foreground left, bobbing peacefully and watching the boat sail into the sun!
      const duckY = 705 + Math.sin(tGlobal * 2.3) * 3.0;
      const duckTilt = -0.07 - sail * 0.04;
      drawFluffyDuckling(st, 405, duckY, 1.32, { facingRight: true, headTilt: duckTilt, withRipples: true, sunFromRight: true });

      // Floating warm afternoon bokeh orbs drifting gently upward in the sunlight!
      for (let i = 0; i < 18; i++) {
        const bx = 760 + ((i * 83) % 740) + Math.sin(tGlobal * 0.6 + i) * 18;
        const by = 420 - ((tGlobal * (10 + (i % 5) * 4) + i * 37) % 340);
        const br = 10 + (i % 6) * 4.5;
        const ba = (0.22 + 0.25 * Math.sin(tGlobal * 1.5 + i)) * (1 - Math.abs((by - 250) / 220));
        if (ba > 0.04) st.glow(bx, by, br, br, '#FFFDF4', ba, 'screen');
      }

      // Framing mossy stone, gently swaying reeds & willow
      const sway = Math.sin(tGlobal * 1.2) * 0.045;
      drawRiverStone(st, 145, 795, 108, 46, { rot: 0.12, moss: true });
      drawReedCluster(st, 110, 910, 10, 365, { lean: 0.25 + sway, alpha: 0.64, width: 14 });
      drawWillowBranch(st, 180, -15, 350, 0.22 + sway, { alpha: 0.58, leafCount: 13 });
      drawWillowBranch(st, 340, -20, 270, 0.18 + sway * 1.1, { alpha: 0.48, leafCount: 10 });
    });

    // Gentle warm cream-paper finale fade & poetic "— 完 —" end mark (27.4s..30.0s -> tLocal 4.9..7.5)
    const fadeOut = smoothstep(5.4, 7.3, tLocal);
    if (fadeOut > 0.005) {
      st.ctx.save();
      st.ctx.fillStyle = `rgba(252, 249, 241, ${fadeOut})`;
      st.ctx.fillRect(0, 0, this.w, this.h);
      st.ctx.restore();
    }
    const endAlpha = smoothstep(5.0, 5.9, tLocal) * (1 - smoothstep(6.7, 7.45, tLocal));
    if (endAlpha > 0.01) {
      st.ctx.save();
      st.ctx.globalAlpha = endAlpha;
      st.ctx.fillStyle = '#6E5544';
      st.ctx.font = '500 38px "STKaiti", "KaiTi", "SimSun", serif';
      st.ctx.textAlign = 'center';
      st.ctx.fillText('— 完 —', this.w * 0.5, this.h * 0.5 + 10);
      st.ctx.restore();
    }
  }

  // Render exact frame at time tSec (0.0 .. 30.0) onto targetCanvas with smooth cross-dissolves!
  renderFrame(targetCanvas, tSec) {
    const ctx = targetCanvas.getContext('2d');
    const D = 0.65; // silky 0.65s watercolor cross-dissolve duration

    // Shot boundaries: S1 [0..7.5], S2 [7.5..14.5], S3 [14.5..22.5], S4 [22.5..30.0]
    let warmth = 0.06;
    if (tSec < 7.5 - D) {
      this._renderShot1(targetCanvas, tSec, tSec);
    } else if (tSec < 7.5) {
      const mix = smoothstep(7.5 - D, 7.5, tSec);
      this._renderShot1(this.bufA, tSec, tSec);
      this._renderShot2(this.bufB, tSec - (7.5 - D), tSec);
      ctx.drawImage(this.bufA, 0, 0);
      ctx.save(); ctx.globalAlpha = mix; ctx.drawImage(this.bufB, 0, 0); ctx.restore();
    } else if (tSec < 14.5 - D) {
      this._renderShot2(targetCanvas, tSec - 7.5 + D, tSec);
      warmth = 0.04;
    } else if (tSec < 14.5) {
      const mix = smoothstep(14.5 - D, 14.5, tSec);
      this._renderShot2(this.bufA, tSec - 7.5 + D, tSec);
      this._renderShot3(this.bufB, tSec - (14.5 - D), tSec);
      ctx.drawImage(this.bufA, 0, 0);
      ctx.save(); ctx.globalAlpha = mix; ctx.drawImage(this.bufB, 0, 0); ctx.restore();
    } else if (tSec < 22.5 - D) {
      this._renderShot3(targetCanvas, tSec - 14.5 + D, tSec);
      warmth = 0.07;
    } else if (tSec < 22.5) {
      const mix = smoothstep(22.5 - D, 22.5, tSec);
      this._renderShot3(this.bufA, tSec - 14.5 + D, tSec);
      this._renderShot4(this.bufB, tSec - (22.5 - D), tSec);
      ctx.drawImage(this.bufA, 0, 0);
      ctx.save(); ctx.globalAlpha = mix; ctx.drawImage(this.bufB, 0, 0); ctx.restore();
    } else {
      this._renderShot4(targetCanvas, tSec - 22.5 + D, tSec);
      warmth = 0.09;
    }

    // Opening warm paper fade-in (0.0s .. 0.9s)
    if (tSec < 0.9) {
      const fi = 1 - smoothstep(0.0, 0.9, tSec);
      ctx.save();
      ctx.fillStyle = `rgba(252, 249, 241, ${fi})`;
      ctx.fillRect(0, 0, this.w, this.h);
      ctx.restore();
    }

    // Apply fast, flicker-free optical Arches 300gsm watercolor paper texture!
    this._applyFastPaperPhysics(targetCanvas, warmth);
  }
}


    // === 4. Interactive Offline Picture-Book Cinema Controller ===
    const DURATION = 30.0;
    const canvas = document.getElementById('stage');
    const audio = document.getElementById('bgm');
    const cover = document.getElementById('cover');
    const coverPlayBtn = document.getElementById('coverPlayBtn');
    const playBtn = document.getElementById('playBtn');
    const replayBtn = document.getElementById('replayBtn');
    const muteBtn = document.getElementById('muteBtn');
    const fsBtn = document.getElementById('fsBtn');
    const scrubber = document.getElementById('scrubber');
    const timecode = document.getElementById('timecode');
    const stageWrap = document.getElementById('stageWrap');
    const chapterBtns = Array.from(document.querySelectorAll('.chapter-btn'));

    const film = new PaperBoatFilm(1600, 900);

    let isPlaying = false;
    let currentTime = 2.4; // Show charming cover frame (child launching boat) before play!
    let rafId = null;
    let lastPerf = 0;

    function fmtTime(sec) {
      const s = Math.max(0, Math.min(DURATION, sec));
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(Math.floor(s % 60)).padStart(2, '0');
      return mm + ':' + ss + ' / 00:30';
    }

    function updateChapterHighlight(t) {
      let idx = 0;
      if (t >= 22.5) idx = 3;
      else if (t >= 14.5) idx = 2;
      else if (t >= 7.5) idx = 1;
      chapterBtns.forEach((b, i) => b.classList.toggle('active', i === idx));
    }

    function drawAt(t) {
      const clamped = Math.max(0, Math.min(DURATION, t));
      film.renderFrame(canvas, clamped);
      scrubber.value = clamped.toFixed(2);
      timecode.textContent = fmtTime(clamped);
      updateChapterHighlight(clamped);
    }

    // Draw initial charming cover preview immediately!
    drawAt(2.35);

    function tick(now) {
      if (!isPlaying) return;
      if (!audio.paused && !audio.ended) {
        currentTime = audio.currentTime;
      } else {
        const dt = (now - lastPerf) / 1000;
        currentTime += Math.min(0.1, dt);
      }
      lastPerf = now;

      if (currentTime >= DURATION) {
        currentTime = DURATION;
        drawAt(DURATION);
        pauseFilm();
        cover.classList.remove('hidden');
        coverPlayBtn.querySelector('span:last-child').textContent = '重新播放《纸船的故事》';
        return;
      }

      drawAt(currentTime);
      rafId = requestAnimationFrame(tick);
    }

    function playFilm(startAt = null) {
      if (startAt !== null) {
        currentTime = startAt;
        audio.currentTime = startAt;
      } else if (currentTime >= DURATION - 0.1 || cover.classList.contains('hidden') === false && currentTime === 2.35) {
        currentTime = 0;
        audio.currentTime = 0;
      } else {
        audio.currentTime = currentTime;
      }
      cover.classList.add('hidden');
      isPlaying = true;
      playBtn.textContent = '暂停';
      lastPerf = performance.now();
      audio.play().catch(() => {});
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tick);
    }

    function pauseFilm() {
      isPlaying = false;
      playBtn.textContent = '播放';
      audio.pause();
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    coverPlayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playFilm(0);
    });

    stageWrap.addEventListener('click', () => {
      if (isPlaying) pauseFilm();
      else playFilm();
    });

    playBtn.addEventListener('click', () => {
      if (isPlaying) pauseFilm();
      else playFilm();
    });

    replayBtn.addEventListener('click', () => playFilm(0));

    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      muteBtn.textContent = audio.muted ? '声音：关' : '声音：开';
    });

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) stageWrap.requestFullscreen?.();
      else document.exitFullscreen?.();
    });

    scrubber.addEventListener('input', () => {
      const t = parseFloat(scrubber.value);
      currentTime = t;
      audio.currentTime = t;
      cover.classList.add('hidden');
      drawAt(t);
    });

    chapterBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        const t = parseFloat(btn.dataset.t);
        playFilm(t);
      });
    });

    window.__filmReady = true;
  })();
