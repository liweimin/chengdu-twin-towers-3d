<script>

function reflected(t){

  const height=width*(H/W);

    const pulse=clamp((t-18.86)/.88);
    if(pulse>0&&pulse<1)ripple(x+14,y-4,15+58*pulse,2+5*pulse,.62*(1-pulse));
  }

  const close=1-arc(t,11.3,14),push=.09*bump(t,15.92,22.36);

function ending(t){

  const x=lerp(709,902,travel),y=lerp(371,290,travel)+Math.sin((t-22.4)*3.3)*.61*(1-travel);

<script>
function soundTrack(audio){
  const rate=audio.sampleRate,length=Math.round(DURATION*rate);

    const n=random()*2-1,t=i/rate;

    const end=clamp((DURATION-t)/.8),rise=clamp(t/.39),space=(air-low)*.014;

      *(1+.07*Math.sin(t*2.9)+.041*Math.sin(t*9.13))*(1-.22*Math.exp(-(((t-18.9)/1.2)**2)));
    l[i]=(bed-space)*rise*end;r[i]=(bed+space)*rise*end;

    for(const [delay,gain,p] of [[0,1,pan],[.044,room,.46],[.083,room*.68,-.52],[.149,room*.31,.26]]){
      const start=Math.round((at+delay)*rate),angle=(p+1)*Math.PI/4;

    [15.66,.025,-.15],[16.34,.024,-.04],[18.85,.064,.18],[19.21,.033,.22],
    [20.42,.023,.26],[23.37,.020,-.12],[25.31,.015,.25]])splash(...a);

    [22.88,.011,625,752,.18,-.14],[26.18,.008,1910,2410,.095,.5]]){

const play=document.getElementById("play");
const seek=document.getElementById("seek");
const clock=document.getElementById("clock");
const error=document.getElementById("error");
let audio=null,buffer=null,source=null;
let playing=false,offset=0,zero=0,raf=0,serial=0,pending=false;

function currentTime(){
  return playing?Math.min(DURATION,offset+Math.max(0,audio.currentTime-zero)):offset;
}
function updateTime(t){
  seek.value=t;
  clock.value=t.toFixed(1)+" / 30.5 秒";
}
function stop(){
  if(source){source.onended=null;try{source.stop()}catch{}source.disconnect();source=null}
  cancelAnimationFrame(raf);
}
function pause(){
  serial++;
  pending=false;
  offset=currentTime();
  playing=false;
  stop();
  play.textContent="播放";
  updateTime(offset);
}
function advance(){
  const at=currentTime();
  frame(at);
  updateTime(at);
  if(at>=DURATION-.001){
    offset=DURATION;playing=false;stop();play.textContent="重播";
    return;
  }
  if(playing)raf=requestAnimationFrame(advance);
}
async function start(){
  if(playing||pending)return;
  pending=true;
  const generation=++serial;
  try{
    if(!audio){
      const Audio=window.AudioContext||window.webkitAudioContext;
      if(!Audio)throw new Error("no audio context");
      audio=new Audio();
    }
    if(audio.state!=="running")await audio.resume();
    if(generation!==serial)return;
    if(!buffer)buffer=soundTrack(audio);
    if(offset>=DURATION-.01)offset=0;
    source=audio.createBufferSource();
    source.buffer=buffer;source.connect(audio.destination);
    zero=audio.currentTime+.035;
    source.start(zero,offset);

    advance();
  }catch(err){
    pending=false;playing=false;
    error.textContent="当前浏览器无法启动动画音轨，请用 Chrome、Edge 或 Firefox 打开。";
    error.hidden=false;
  }
}
play.addEventListener("click",()=>playing||pending?pause():start());
seek.addEventListener("input",()=>{
  const next=Number(seek.value),resume=playing||pending;
  pause(); offset=next; frame(offset); updateTime(offset);
  if(resume&&offset<DURATION)start();

});
