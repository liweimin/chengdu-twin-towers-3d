<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浮云秘境 · Floating Island Sanctuary</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8cc4ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      transition: background 1.2s ease;
    }

    body.night-mode {
      background: #0c1328;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Subtle poetic title overlay */
    .hud-title {
      position: fixed;
      top: 22px;
      left: 26px;
      z-index: 10;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.98);
      text-shadow: 0 2px 12px rgba(14, 32, 60, 0.55), 0 1px 3px rgba(14, 32, 60, 0.45);
    }

    .hud-title h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.14em;
      margin-bottom: 4px;
    }

    .hud-title p {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.88);
    }

    /* Bottom glassmorphic control bar */
    .hud-controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(20, 38, 66, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(14, 30, 58, 0.24);
      transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
    }

    body.night-mode .hud-controls {
      background: rgba(15, 23, 48, 0.56);
      border-color: rgba(160, 195, 255, 0.26);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.48);
    }

    .hud-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.3);
      margin: 0 2px;
    }

    .hud-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.22s ease, transform 0.16s ease, color 0.22s ease;
      text-shadow: 0 1px 6px rgba(15, 28, 50, 0.25);
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .hud-btn:active {
      transform: scale(0.96);
    }

    .hud-btn.active {
      background: rgba(255, 255, 255, 0.32);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .hud-btn.primary {
      background: rgba(255, 245, 220, 0.32);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
    }

    body.night-mode .hud-btn.primary {
      background: rgba(112, 152, 240, 0.3);
      box-shadow: inset 0 0 0 1px rgba(170, 205, 255, 0.4);
    }

    .icon-sun, .icon-moon {
      width: 15px;
      height: 15px;
      display: inline-block;
      vertical-align: middle;
    }

    body:not(.night-mode) .icon-moon { display: none; }
    body.night-mode .icon-sun { display: none; }

    /* Subtle interaction hint */
    .hud-hint {
      position: fixed;
      top: 22px;
      right: 26px;
      z-index: 10;
      pointer-events: none;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(20, 38, 66, 0.26);
      padding: 5px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-shadow: 0 1px 6px rgba(15, 32, 56, 0.4);
      letter-spacing: 0.04em;
    }

    @media (max-width: 680px) {
      .hud-hint { display: none; }
      .hud-title { top: 14px; left: 16px; }
      .hud-title h1 { font-size: 16px; }
      .hud-controls {
        bottom: 16px;
        max-width: calc(100vw - 24px);
        overflow-x: auto;
        padding: 6px 8px;
        gap: 4px;
      }
      .hud-btn { padding: 6px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-title">
    <h1>浮云秘境</h1>
    <p>FLOATING ISLAND SANCTUARY</p>
  </div>

  <div class="hud-hint">左键旋转 · 滚轮缩放 · 右键平移 · N 切换昼夜</div>

  <div class="hud-controls" role="toolbar" aria-label="场景控制">
    <button id="btn-day-night" class="hud-btn primary" aria-pressed="false" title="切换白天与夜晚 (快捷键 N)">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <span class="label">白天</span>
    </button>

    <div class="hud-divider"></div>

    <button class="hud-btn active" data-preset="overview">全景</button>
    <button class="hud-btn" data-preset="cabin">小屋</button>
    <button class="hud-btn" data-preset="waterfall">瀑布</button>
    <button class="hud-btn" data-preset="summit">山巅</button>

    <div class="hud-divider"></div>

    <button id="btn-auto-rotate" class="hud-btn" title="自动漫游旋转 (快捷键 R)">漫游</button>
  </div>
